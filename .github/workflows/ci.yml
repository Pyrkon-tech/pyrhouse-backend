name: CI

# Mirrors `make check-full` from the workspace: build, vet, unit + integration tests against a migrated Postgres.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pyrpyr
          POSTGRES_DB: pyrhouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pyrpyr@localhost:5432/pyrhouse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Migrate test database
        run: DATABASE_URL="$TEST_DATABASE_URL" go run ./main.go -migrate -dir=./migrations

      # -p 1: integration tests of all packages share one database (see Makefile `test`)
      - name: Test
        run: go test -p 1 -count=1 -timeout=300s ./...
