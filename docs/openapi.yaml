  /equipment-requests/sync:
    post:
      tags:
        - equipment-requests
      summary: Manual sync from Google Sheets to database
      description: |
        Triggers manual synchronization from the equipment request Google Sheet.
        Fetches all rows from the configured sheet, aggregates them into quests based on
        destination, recipient, delivery date, and pickup time. Persists to database with upsert logic.

        **Phase 2:** Database persistence with fuzzy category matching (Levenshtein distance).

        Sync process:
        1. Fetch from Google Sheets
        2. Parse and aggregate into quests
        3. Fuzzy match categories (manual > exact > fuzzy > none)
        4. Upsert to database (create new or update existing)
        5. Track sync statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync completed successfully with statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sync completed successfully"
                  stats:
                    type: object
                    properties:
                      quests_created:
                        type: integer
                        example: 2
                      quests_updated:
                        type: integer
                        example: 1
                      quests_unchanged:
                        type: integer
                        example: 0
                      items_added:
                        type: integer
                        example: 5
                      items_removed:
                        type: integer
                        example: 2
                  quests:
                    type: array
                    items:
                      $ref: "#/components/schemas/EquipmentRequestQuest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to sync equipment requests"
                  details:
                    type: string
                    example: "unable to read spreadsheet: API error"

  /equipment-requests/quests:
    get:
      tags:
        - equipment-requests
      summary: List equipment request quests from database
      description: |
        Returns quests from database with optional filtering and pagination.

        **Phase 2:** Database-backed with pagination and status filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by quest status
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
            example: "pending"
        - name: limit
          in: query
          required: false
          description: Maximum number of quests to return (max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
            example: 50
        - name: offset
          in: query
          required: false
          description: Number of quests to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200":
          description: List of quests with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of quests returned
                    example: 2
                  limit:
                    type: integer
                    description: Limit applied
                    example: 50
                  offset:
                    type: integer
                    description: Offset applied
                    example: 0
                  quests:
                    type: array
                    items:
                      $ref: "#/components/schemas/EquipmentRequestQuest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-requests/quests/{id}:
    get:
      tags:
        - equipment-requests
      summary: Get single quest by ID
      description: Retrieves details of a specific equipment request quest by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID (generated hash)
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
      responses:
        "200":
          description: Quest details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentRequestQuest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Quest not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Quest not found"

    patch:
      tags:
        - equipment-requests
      summary: Update quest status
      description: |
        Updates the status of an equipment request quest.

        Valid statuses: pending, in_progress, completed, cancelled

        **Important:** If the quest is linked to a transfer (transfer_id is not null),
        manual status changes are rejected with 409 Conflict. Use transfer endpoints
        (confirm/cancel) instead — quest status is automatically synced from transfer.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                  example: "in_progress"
      responses:
        "200":
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quest status updated successfully"
                  status:
                    type: string
                    example: "in_progress"
        "400":
          description: Invalid status value
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Quest is linked to a transfer — manual status changes not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Quest status is managed by linked transfer"
                  details:
                    type: string
                    example: "Quest is linked to transfer 42. Use transfer endpoints to change status."
        "500":
          $ref: "#/components/responses/DefaultError"

  /equipment-requests/quests/{id}/transfer:
    post:
      tags:
        - equipment-requests
      summary: Create transfer from quest
      description: |
        Creates an inventory transfer from an equipment request quest.

        The quest must be in 'pending' status and not already linked to a transfer.
        Resolves destination location from quest pavilion+location if to_location_id is not provided.
        Resolves stock items from quest item categories if stock_items are not provided.

        On success, the quest status changes to 'in_progress' and transfer_id is set.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_location_id
              properties:
                from_location_id:
                  type: integer
                  description: Source warehouse location ID
                  example: 1
                to_location_id:
                  type: integer
                  nullable: true
                  description: Destination location ID (auto-resolved from quest if not provided)
                  example: 5
                stock_items:
                  type: array
                  description: Stock items to transfer (auto-resolved from quest categories if not provided)
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                    properties:
                      id:
                        type: integer
                        description: Non-serialized stock item ID
                      quantity:
                        type: integer
                        minimum: 1
                assets:
                  type: array
                  description: Serialized assets to include in transfer
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        description: Serialized asset item ID
                users:
                  type: array
                  description: Users assigned to delivery
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
      responses:
        "201":
          description: Transfer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transfer created from quest successfully"
                  transfer_id:
                    type: integer
                    example: 42
                  quest_id:
                    type: string
                    example: "quest-f6c39c6c14716069"
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Quest not found
        "409":
          description: Quest already linked to a transfer or not in pending status
        "422":
          description: Could not resolve destination location or stock items

