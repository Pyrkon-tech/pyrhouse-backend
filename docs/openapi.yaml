        - shop
      summary: Delivery locations
      security:
        - shopBearerAuth: []
      responses:
        "200":
          description: Locations (group by pavilion in the UI)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopLocation"
        "401":
          $ref: "#/components/responses/ShopError"

  /shop/delivery-windows:
    get:
      operationId: getShopDeliveryWindows
