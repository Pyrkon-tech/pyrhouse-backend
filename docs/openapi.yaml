openapi: 3.1.0
info:
  title: PyrHouse API
  description: Warehouse inventory management system API for tracking assets, stock items, locations, and transfers.
  version: 0.1.0
  contact:
    email: warrmag7@gmail.com
  license:
    name: AGPL-3.0 with an additional no-SaaS restriction
    url: https://github.com/Pyrkon-tech/pyrhouse-backend/blob/master/LICENSE

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication and authorization (JWT, Discord OAuth2)
  - name: items
    description: Combined inventory item queries (assets + stock)
  - name: asset
    description: Serialized asset management (tracked by serial/PYR code)
  - name: stock
    description: Non-serialized stock item management (tracked by quantity)
  - name: item category
    description: Item category management
  - name: location
    description: Storage location management
  - name: transfer
    description: Asset and stock transfers between locations
  - name: users
    description: User account management and RBAC
  - name: equipment-requests
    description: Equipment request quests (dispatch, transfers from quests, budget)
  - name: origins
    description: Origin management — predefined and custom asset/stock sources
  - name: settings
    description: Application settings management (admin only)
  - name: service-desk
    description: Service desk request management
  - name: dispatch
    description: Dispatch map — volunteer status and quest assignment
  - name: releases
    description: Permanent inventory releases — remove items from stock with a receipt for PDF generation
  - name: scheduling
    description: Volunteer schedule management — slots, day windows, assignments, and generation
  - name: shop
    description: Organizer shop (shop.pyrhouse.space) — shop tokens only, see shopBearerAuth
  - name: shop-admin
    description: Shop panel in the warehouse — products, windows, orders, accounts, invites (moderator; settings admin)

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - utility
      summary: Health check
      description: Returns application health status, uptime, and version.
      security: []
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth:
    post:
      tags:
        - auth
      summary: Authenticate with credentials
      description: Authenticates a user with username and password, returns a JWT token. Rate limited to 7 attempts per 5 minutes per IP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        "201":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/discord:
    get:
      tags:
        - auth
      summary: Initiate Discord OAuth2 login
      description: |
        Redirects the user to the Discord authorization page.
        After successful authorization, Discord redirects back to `/auth/discord/callback`.
        A CSRF state token is stored in a cookie for verification.
      operationId: discordLogin
      security: []
      responses:
        "307":
          description: Redirect to Discord OAuth authorization page
          headers:
            Location:
              schema:
                type: string
              description: Discord authorization URL

  /auth/discord/callback:
    get:
      tags:
        - auth
      summary: Discord OAuth2 callback
      description: |
        Callback endpoint invoked by Discord after user authorization.
        Exchanges the authorization code for an access token, fetches user data, and creates or finds the user.

        **Behavior depends on configuration:**
        - If `FRONTEND_URL` is set: redirects to frontend with token or error as query parameter
          - Success: `{FRONTEND_URL}?token=eyJhbG...`
          - Error: `{FRONTEND_URL}?error=Account+is+inactive`
        - If `FRONTEND_URL` is not set: returns JSON response

        **Auto-linking:** If an account with the same username exists (not linked to Discord),
        it will be automatically linked to the Discord account.

        New Discord users are created with `active=false` and require manual activation by an admin.
      operationId: discordCallback
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: true
          description: Authorization code from Discord
        - in: query
          name: state
          schema:
            type: string
          required: true
          description: State parameter for CSRF protection
      responses:
        "307":
          description: Redirect to frontend (when FRONTEND_URL is configured)
          headers:
            Location:
              schema:
                type: string
              description: Frontend URL with token or error query parameter
        "200":
          description: Login successful (fallback when FRONTEND_URL is not set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
        "400":
          description: Invalid state parameter or missing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /items/{category}/{id}:
    get:
      tags:
        - items
      summary: Get single item with history
      description: |
        Returns a single item (asset or stock) along with its audit log history.

        - `category=asset` → returns asset fields + `assetLogs`
        - `category=stock` → returns stock item fields + `logs`
      operationId: getItem
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            enum: [asset, stock]
          description: Item type
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Item ID
      responses:
        "200":
          description: Item with audit log history
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AssetWithLogs"
                  - $ref: "#/components/schemas/StockWithLogs"
        "400":
          description: Invalid URI parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /items:
    get:
      tags:
        - items
      summary: List all inventory items
      description: Returns a combined array of serialized assets and non-serialized stock items. Supports filtering by location, category, and type.
      operationId: listItems
      parameters:
        - in: query
          name: location_ids
          schema:
            type: array
            items:
              type: integer
          description: Filter by location IDs
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter by category ID
        - in: query
          name: category_type
          schema:
            type: string
            enum: [asset, stock]
          description: Filter by item type (asset or stock)
        - in: query
          name: category_label
          schema:
            type: string
          description: Filter by category label
      responses:
        "200":
          description: Combined list of assets and stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: "#/components/schemas/Item"
                    - $ref: "#/components/schemas/StockItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets:
    post:
      tags:
        - asset
      summary: Create a new asset
      description: Creates a new serialized asset with a unique serial number. A PYR code is automatically generated.
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serial
                - category_id
                - origin
              properties:
                serial:
                  type: string
                  description: Unique serial number
                category_id:
                  type: integer
                  description: Category ID for this asset
                origin:
                  type: string
                  description: "Origin string — validated against the origins table. Use GET /origins to list available values. For origins with allow_suffix=true (e.g. personal, other), append a suffix with a hyphen (e.g. personal-jan)."
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets/pyrcode/{pyrcode}:
    get:
      tags:
        - asset
      summary: Get asset by PYR code
      description: Retrieves a single asset by its PYR code (barcode value).
      operationId: getAssetByPyrcode
      parameters:
        - in: path
          name: pyrcode
          schema:
            type: string
          required: true
          description: PYR code value (e.g. PYR-LT123)
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Asset not found

  /assets/bulk:
    post:
      tags:
        - asset
      summary: Bulk create assets
      description: Creates multiple assets with the same category, location, and status.
      operationId: bulkCreateAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serials
                - category_id
                - origin
              properties:
                serials:
                  type: array
                  items:
                    type: string
                  description: List of serial numbers
                location_id:
                  type: integer
                  description: Location ID (defaults to 1)
                status:
                  type: string
                  description: Asset status (defaults to "available")
                category_id:
                  type: integer
                  description: Category ID for all assets
                origin:
                  type: string
                  description: "Origin string — validated against the origins table. Use GET /origins to list available values."
      responses:
        "201":
          description: All assets created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAssets"
        "400":
          description: >-
            Invalid request payload or category type, or some serials failed — then nothing is created and
            `errors` lists the failures
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  details:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string

  /assets/without-serial:
    post:
      tags:
        - asset
      summary: Create assets without serial numbers
      description: Creates `quantity` assets of an asset-type category that have no serial number yet.
      operationId: createAssetsWithoutSerial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
                - category_id
                - origin
              properties:
                quantity:
                  type: integer
                  minimum: 1
                location_id:
                  type: integer
                  description: Location ID (defaults to 1)
                status:
                  type: string
                  description: Asset status (defaults to "available")
                category_id:
                  type: integer
                origin:
                  type: string
                  description: "Origin string — validated against the origins table. Use GET /origins to list available values."
      responses:
        "201":
          description: Assets created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAssets"
        "400":
          description: Invalid request payload or category type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/{assetID}:
    delete:
      tags:
        - asset
      summary: Delete an asset
      description: Deletes an asset by ID. Fails if the asset is currently in transit or unavailable.
      operationId: deleteAsset
      parameters:
        - in: path
          name: assetID
          schema:
            type: integer
          required: true
          description: Asset ID
      responses:
        "200":
          description: Asset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "409":
          description: Cannot delete - asset is in transit or unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /stocks:
    get:
      tags:
        - stock
      summary: List stock items
      operationId: listStocks
      parameters:
        - in: query
          name: location_id
          schema:
            type: integer
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: category_label
          schema:
            type: string
      responses:
        "200":
          description: Stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stock"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"
    post:
      tags:
        - stock
      summary: Create a stock item
      description: Creates a non-serialized stock item tracked by quantity.
      operationId: createStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category_id
                - quantity
              properties:
                category_id:
                  type: integer
                  example: 4
                  description: Category ID for this stock item
                quantity:
                  type: integer
                  example: 99
                  description: Initial quantity
      responses:
        "201":
          description: Stock item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
        "500":
          $ref: "#/components/responses/DefaultError"
        "400":
          description: Invalid request payload or origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /locations:
    get:
      tags:
        - location
      summary: List locations
      description: Returns all locations ordered by ID. Public (no authentication).
      operationId: listLocations
      security: []
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "500":
          $ref: "#/components/responses/DefaultError"
    post:
      tags:
        - location
      summary: Create a new location
      description: Creates a new storage location. Requires moderator.
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                pavilion:
                  type: [string, "null"]
                details:
                  type: [string, "null"]
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid payload
        "409":
          description: Location name already taken

  /locations/{locationID}/assets:
    get:
      tags:
        - location
      summary: Get items in location
      description: Returns all assets and stock items stored in the specified location.
      operationId: getLocationItems
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
      responses:
        "200":
          description: Items in location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationEquipment"
        "500":
          $ref: "#/components/responses/DefaultError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /locations/{locationID}:
    get:
      tags:
        - location
      summary: Get a location
      operationId: getLocation
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"
    patch:
      tags:
        - location
      summary: Update a location
      description: Updates the given fields; at least one is required. An empty pavilion or details clears it. Requires moderator.
      operationId: updateLocation
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                name:
                  type: string
                pavilion:
                  type: string
                details:
                  type: string
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/DefaultError"
    delete:
      tags:
        - location
      summary: Delete a location
      description: Deletes a location by ID. Fails if the location still contains items.
      operationId: deleteLocation
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
      responses:
        "200":
          description: Location deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Location deleted successfully
        "409":
          description: Cannot delete - location still contains items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /locations/{locationID}/search:
    get:
      tags:
        - location
      summary: Search items in location
      description: Search for items in a specific location by serial number, category name, or category label.
      operationId: searchLocationItems
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
        - in: query
          name: q
          schema:
            type: string
          required: true
          description: Search query (minimum 1 character)
      responses:
        "200":
          description: Matching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers:
    get:
      tags:
        - transfer
      summary: List transfers
      description: Returns transfers (without their items), optionally filtered.
      operationId: listTransfers
      parameters:
        - in: query
          name: from_location_id
          schema:
            type: integer
        - in: query
          name: to_location_id
          schema:
            type: integer
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TransferStatus"
      responses:
        "200":
          description: List of transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferSummary"
        "500":
          $ref: "#/components/responses/DefaultError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - transfer
      summary: Create a new transfer
      description: >-
        Creates a new transfer of assets and stock items between locations. At least one of `assets` / `stocks`
        is required; source and destination must differ.
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_location_id
                - location_id
              properties:
                from_location_id:
                  type: integer
                  example: 1
                  description: Source location ID
                location_id:
                  type: integer
                  example: 2
                  description: Destination location ID
                assets:
                  type: array
                  description: Serialized assets to transfer
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
                        description: Asset ID
                stocks:
                  type: array
                  description: Stock items to transfer
                  items:
                    type: object
                    required: [id, quantity]
                    properties:
                      id:
                        type: integer
                        description: Stock item ID
                      quantity:
                        type: integer
                        minimum: 1
                        description: Quantity to transfer
                users:
                  type: array
                  description: Users carrying out the transfer
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
                        description: User ID
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Warehouse validation failed (items not in source location)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Warehouse equipment validation failed
                  reasons:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidationError"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}:
    get:
      tags:
        - transfer
      summary: Get transfer details
      description: Returns detailed information about a transfer by ID.
      operationId: getTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      responses:
        "200":
          description: Transfer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          description: Invalid transfer ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Transfer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}/confirm:
    patch:
      tags:
        - transfer
      summary: Confirm a transfer
      description: Confirms a transfer and updates asset locations to the destination.
      operationId: confirmTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      responses:
        "200":
          description: Transfer confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "500":
          description: Unable to confirm transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid transfer ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transfers/{transferID}/cancel:
    patch:
      tags:
        - transfer
      summary: Cancel a transfer
      description: >-
        Cancels an in-transit transfer and restores all assets and stock items to their original location.
        400 when the transfer is already completed or cancelled.
      operationId: cancelTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      responses:
        "200":
          description: Transfer cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "500":
          description: Unable to cancel transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid transfer ID, or the transfer is not in transit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transfers/{transferID}/assets/{itemID}/restore-to-location:
    patch:
      tags:
        - transfer
      summary: Remove asset from transfer
      description: Removes an asset from a transfer and restores it to the specified location.
      operationId: restoreAssetFromTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
        - in: path
          name: itemID
          schema:
            type: integer
          required: true
          description: Asset ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location_id
              properties:
                location_id:
                  type: integer
                  example: 1
                  description: Location ID to restore the asset to
      responses:
        "200":
          description: Asset removed from transfer
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer_id:
                    type: integer
                    example: 3
        "400":
          description: Invalid request (missing location_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}/categories/{categoryID}/restore-to-location:
    patch:
      tags:
        - transfer
      summary: Remove stock item from transfer
      description: Removes a stock item from a transfer and restores the specified quantity to a location.
      operationId: restoreStockFromTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
        - in: path
          name: categoryID
          schema:
            type: integer
          required: true
          description: Stock item category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location_id
                - quantity
              properties:
                location_id:
                  type: integer
                  example: 1
                  description: Location ID to restore stock to
                quantity:
                  type: integer
                  example: 32
                  description: Quantity to restore
      responses:
        "200":
          description: Stock item removed from transfer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Stock item removed from transfer successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to remove stock item from transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfers/{transferID}/delivery-location:
    patch:
      tags:
        - transfer
      summary: Update transfer delivery location
      description: Updates the GPS delivery location for an in-transit or completed transfer.
      operationId: updateDeliveryLocation
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delivery_location
              properties:
                delivery_location:
                  type: object
                  required:
                    - lat
                    - lng
                    - timestamp
                  properties:
                    lat:
                      type: number
                      format: float
                      description: Latitude
                      example: 50.00366850638076
                    lng:
                      type: number
                      format: float
                      description: Longitude
                      example: 20.235703352753667
                    timestamp:
                      type: string
                      format: date-time
                      description: Delivery timestamp
                      example: "2025-04-18T21:43:12.473Z"
      responses:
        "200":
          description: Delivery location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request (only in-transit or completed transfers can be updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}/users:
    put:
      tags:
        - transfer
      summary: Replace transfer users
      description: Sets the users carrying out the transfer (replaces the previous list).
      operationId: updateTransferUsers
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  description: User IDs
                  items:
                    type: integer
      responses:
        "200":
          description: Users updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/users/{userID}:
    get:
      tags:
        - transfer
      summary: Transfers of a user
      description: Transfers the user is assigned to, in the given status. Own transfers, or any user's for moderator+.
      operationId: listUserTransfers
      parameters:
        - in: path
          name: userID
          schema:
            type: integer
          required: true
        - in: query
          name: status
          required: true
          schema:
            $ref: "#/components/schemas/TransferStatus"
      responses:
        "200":
          description: Transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Another user's transfers without moderator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/{assetID}/serial:
    parameters:
      - in: path
        name: assetID
        required: true
        schema:
          type: integer
        description: Asset ID
    patch:
      tags:
        - asset
      summary: Change an asset's serial number
      description: Requires dispatcher role.
      operationId: updateAssetSerial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial]
              properties:
                serial:
                  type: string
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid ID or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Serial number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/{assetID}/logs/location:
    parameters:
      - in: path
        name: assetID
        required: true
        schema:
          type: integer
        description: Asset ID
    patch:
      tags:
        - asset
      summary: Log an asset's GPS position
      description: Appends a location entry to the asset's audit log (shown on the asset timeline).
      operationId: logAssetLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_location]
              properties:
                delivery_location:
                  type: object
                  required: [lat, lng, timestamp]
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                    timestamp:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid ID or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/report:
    get:
      tags:
        - asset
      summary: Assets report (CSV)
      description: Requires moderator role.
      operationId: getAssetsReport
      responses:
        "200":
          description: CSV file (attachment)
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /stocks/report:
    get:
      tags:
        - stock
      summary: Stock report (CSV)
      description: Requires moderator role.
      operationId: getStockReport
      responses:
        "200":
          description: CSV file (attachment)
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /stocks/{stockID}:
    parameters:
      - in: path
        name: stockID
        required: true
        schema:
          type: integer
        description: Stock item ID
    patch:
      tags:
        - stock
      summary: Update a stock item
      description: Requires dispatcher role.
      operationId: updateStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                location_id:
                  type: integer
                quantity:
                  type: integer
                origin:
                  type: string
                  description: Origin string, validated against GET /origins
      responses:
        "200":
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
        "400":
          description: Invalid ID, payload or origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"
    delete:
      tags:
        - stock
      summary: Delete a stock item
      description: Requires moderator role.
      operationId: deleteStock
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/reservations:
    post:
      tags:
        - asset
      summary: Reserve PYR codes
      description: Reserves `quantity` PYR codes of a category for labels printed before the assets exist.
      operationId: reservePyrCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, quantity]
              properties:
                category_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 200
      responses:
        "201":
          description: Reserved codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: "#/components/schemas/PyrCodeReservation"
        "400":
          description: Invalid payload or category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      tags:
        - asset
      summary: List PYR code reservations
      operationId: listReservations
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [free, claimed, all]
            default: free
        - in: query
          name: category_id
          schema:
            type: integer
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PyrCodeReservation"
        "400":
          description: Invalid status or category_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"
    delete:
      tags:
        - asset
      summary: Delete reservations
      description: By PYR codes or IDs; claimed reservations cannot be deleted (409). Requires moderator role.
      operationId: deleteReservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pyr_codes:
                  type: array
                  items:
                    type: string
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        "400":
          description: Neither pyr_codes nor ids given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Some reservations are already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/reservations/claim:
    post:
      tags:
        - asset
      summary: Create assets from reserved codes
      description: Turns reserved PYR codes into assets (optionally with serials). Per-code failures return 400.
      operationId: claimReservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, items]
              properties:
                origin:
                  type: string
                location_id:
                  type: integer
                  description: Defaults to 1
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [pyr_code]
                    properties:
                      pyr_code:
                        type: string
                      serial:
                        type: [string, "null"]
      responses:
        "201":
          description: Created assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          description: Invalid payload, or some codes cannot be claimed (errors[])
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /search:
    get:
      tags:
        - items
      summary: Global search
      description: Matches PYR code, serial, category, location and origin (at least 2 characters).
      operationId: globalSearch
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  stocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stock"
        "400":
          description: Query shorter than 2 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /dispatch/stream:
    get:
      tags:
        - dispatch
      summary: Dispatch events (SSE)
      description: Server-Sent Events with volunteer status changes for the dispatch map; the event name is the `type` field.
      operationId: streamDispatch
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health/ready:
    get:
      tags:
        - system
      summary: Readiness
      description: 503 while the database is unreachable.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Database unreachable

  /auth/google:
    get:
      tags:
        - auth
      summary: Start Google login (redirect)
      operationId: googleLogin
      security: []
      responses:
        "307":
          description: Redirect to Google's consent screen

  /auth/google/exchange:
    post:
      tags:
        - auth
      summary: Exchange a Google authorization code for a warehouse token
      description: Restricted to the allowed Google Workspace domain; inactive accounts get 403.
      operationId: googleExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code:
                  type: string
                redirect_uri:
                  type: string
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Warehouse JWT
        "400":
          description: Invalid body or code exchange failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Domain not allowed or account inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /auth/discord/exchange:
    post:
      tags:
        - auth
      summary: Exchange a Discord authorization code for a warehouse token
      description: Inactive accounts get 403.
      operationId: discordExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code:
                  type: string
                redirect_uri:
                  type: string
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Warehouse JWT
        "400":
          description: Invalid body or code exchange failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"


  /assets/categories:
    get:
      tags:
        - item category
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"
    post:
      tags:
        - item category
      summary: Create a category
      description: Name and PYR ID are generated from the label unless given. Requires dispatcher role.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                type:
                  type: string
                  enum: [asset, stock]
                pyr_id:
                  type: string
                  description: 1–4 alphanumeric characters
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCategory"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets/categories/{categoryID}:
    parameters:
      - in: path
        name: categoryID
        schema:
          type: integer
        required: true
        description: Category ID
    patch:
      tags:
        - item category
      summary: Update a category
      description: Changing the type or PYR ID is refused (409) while items use the category. Requires admin role.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                label:
                  type: string
                type:
                  type: string
                  enum: [asset, stock]
                pyr_id:
                  type: string
                  description: 1–3 alphanumeric characters
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid payload or nothing to update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Category is in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"
    delete:
      tags:
        - item category
      summary: Delete a category
      description: Fails (409) while assets or stock use the category. Requires moderator role.
      operationId: deleteCategory
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Category is in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /users:
    post:
      tags:
        - users
      summary: Create a user
      description: Creates an active user account. Requires admin role.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                fullname:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
                points:
                  type: integer
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already taken (code USERNAME_TAKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"
    get:
      tags:
        - users
      summary: List all users
      description: Returns all users ordered by ID. Requires dispatcher role or higher.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserListItem"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /users/register:
    post:
      tags:
        - users
      summary: Self-register
      description: >-
        Public. Creates an inactive account with role `user` and no points (any `role`, `points` or `active` in
        the body is ignored); a moderator activates it.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                fullname:
                  type: string
      responses:
        "200":
          description: Account created (inactive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already taken (code USERNAME_TAKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /users/{id}:
    parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: integer
    get:
      tags:
        - users
      summary: Get user by ID
      description: Own account, or any account for moderator+.
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetails"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - not your account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"
    patch:
      tags:
        - users
      summary: Update a user
      description: >-
        Updates the given fields. Owners may change their own fullname, username and password; moderators may
        also (de)activate plain users; admins may change everything including role and points.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                fullname:
                  type: string
                username:
                  type: string
                password:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
                points:
                  type: integer
                active:
                  type: boolean
