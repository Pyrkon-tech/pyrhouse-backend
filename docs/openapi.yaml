      properties:
        id:
          type: integer
        username:
          type: string
        fullname:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/Role"
        points:
          type: integer
        active:
          type: boolean
        discord_username:
          type: [string, "null"]
        auth_provider:
          $ref: "#/components/schemas/AuthProvider"

    UserDetails:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: johndoe
        fullname:
          type: [string, "null"]
          example: John Doe
        role:
          $ref: "#/components/schemas/Role"
        points:
          type: integer
          description: User reward points
          example: 0
        active:
          type: boolean
          description: Whether the account is active
          example: true
        discord_id:
          type: [string, "null"]
          description: Discord user ID (if linked)
        discord_username:
          type: [string, "null"]
          description: Discord username (if linked)
        avatar_url:
          type: [string, "null"]
          description: Avatar URL from Discord or Google (if linked)
        google_id:
          type: [string, "null"]
          description: Google account ID (if linked)
        google_email:
          type: [string, "null"]
          description: Google account e-mail (if linked)
        auth_provider:
          $ref: "#/components/schemas/AuthProvider"

    Role:
      type: string
      description: "User permission level (hierarchical: user < dispatcher < moderator < admin)"
      enum:
        - user
        - dispatcher
        - moderator
        - admin
      example: user

    EquipmentRequestQuest:
      type: object
      description: Equipment request quest (historic quests were imported from the Google Sheets form)
      properties:
        id:
          type: string
          description: Generated quest ID (MD5 hash of quest key)
          example: "quest-f6c39c6c14716069"
        destination:
          $ref: "#/components/schemas/QuestDestination"
        recipient:
          type: string
          description: Person who will receive the equipment
          example: "Jan Kowalski"
        delivery_date:
          type: string
          format: date
          description: When equipment should be delivered
          example: "2025-06-13"
        return_date:
          type: [string, "null"]
          format: date
          description: When the equipment comes back (null for sheet quests)
          example: "2025-06-16"
        pickup_time:
          type: string
          description: When to pick up equipment (flexible format)
          example: "17-18"
        budget_owner:
          type: string
          description: Person responsible for budget approval
          example: "Anna Nowak"
        items:
          type: array
          description: List of requested items in this quest
          items:
            $ref: "#/components/schemas/QuestItem"
        status:
          type: string
          description: Quest processing status
          enum:
            - pending
            - in_progress
            - completed
            - cancelled
          example: "pending"
        transfers:
          type: array
          description: All transfers created from this quest (a quest can be delivered in several)
          items:
            $ref: "#/components/schemas/QuestTransfer"
        assigned_volunteers:
          type: array
          description: Volunteers assigned to the quest's transfers
          items:
            $ref: "#/components/schemas/QuestVolunteer"
        location_id:
          type: [integer, "null"]
          description: Resolved location ID from pavilion+location (null if unresolved)
          example: 3
        location_name:
          type: [string, "null"]
          description: Name of the resolved location
        location_resolved:
          type: boolean
          description: Whether the destination location was successfully resolved
          default: false
          example: true
        shop_order_id:
          type: [integer, "null"]
          description: Shop order this quest was confirmed from (source `shop`)
        source:
          type: string
          description: Where the quest came from — `sheet` (historic Google Sheets import) or `shop` (confirmed organizer shop order)
          enum:
            - sheet
            - shop
          example: "shop"

    QuestTransfer:
      type: object
      properties:
        transfer_id:
          type: integer
        status:
          type: string
          enum: [in_transit, completed, cancelled]
        created_at:
          type: string
          format: date-time

    QuestsListResponse:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        quests:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentRequestQuest"

    QuestDestination:
      type: object
      description: Equipment delivery destination
      properties:
        pavilion:
          type: string
          description: Destination pavilion
          example: "PCC"
        location:
          type: string
          description: Specific location within pavilion
          example: "Maskarada"

    QuestItem:
      type: object
      description: Individual item in an equipment request quest
      properties:
        name:
          type: string
          description: Item name as ordered
          example: "Laptop"
        quantity:
          type: [integer, "null"]
          minimum: 1
          description: Quantity requested. Null when unknown (historic sheet items left it blank) — the dispatcher must supply a quantity before a transfer can be created.
          example: 4
        category_id:
          type: [integer, "null"]
          description: Item category ID (null only for historic sheet items that matched no category)
          example: 123
        category_name:
          type: [string, "null"]
          description: Category label (read-only)
          example: "Laptop"
        budget_owner:
          type: string
          description: Budget owner for this specific item (can differ from quest budget_owner)
          example: "Anna Nowak"
        notes:
          type: string
          description: Additional notes from requestor
          example: "Must have good battery life"

    PriceListItem:
      type: object
      properties:
        id:
          type: integer
        item_name:
          type: string
          example: "Laptop"
        supplier:
          type: string
          example: "Probis"
        unit_price:
          type: number
          format: float
          example: 140
        updated_at:
          type: string
          format: date-time

    UpsertPriceRequest:
      type: object
      required:
        - item_name
        - supplier
        - unit_price
      properties:
        item_name:
          type: string
          example: "Laptop"
        supplier:
          type: string
          description: Supplier name — any string. Adding a new supplier requires no schema change.
          example: "Oki-event"
        unit_price:
          type: number
          format: float
          minimum: 0
          example: 120

    SupplierPrice:
      type: object
      properties:
        supplier:
          type: string
          example: "Probis"
        unit_price:
          type: number
          format: float
          example: 140
        total:
          type: number
          format: float
          example: 10920

    SupplierTotal:
      type: object
      properties:
        supplier:
          type: string
          example: "Probis"
        total:
          type: number
          format: float
          example: 35860

    BudgetItem:
      type: object
      properties:
        item_name:
          type: string
          example: "Laptop"
        quantity:
          type: integer
          example: 78
        prices:
          type: array
          description: One entry per supplier that has a price for this item. Empty array = unpriced.
          items:
            $ref: "#/components/schemas/SupplierPrice"

    BudgetSummary:
      type: object
      properties:
        total_positions:
          type: integer
          description: Number of distinct item types
          example: 17
        total_quantity:
          type: integer
          description: Total number of units across all items
          example: 582
        supplier_totals:
          type: array
          description: Grand total per supplier, sorted by supplier name
          items:
            $ref: "#/components/schemas/SupplierTotal"
        unpriced_count:
          type: integer
          description: Number of item types with no price from any supplier
          example: 7
        items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetItem"

    # ── Dispatch ──────────────────────────────────────────────────────────

    Volunteer:
      type: object
      properties:
        id:
          type: integer
          description: Same as User.id — one ID system across the whole application.
          example: 4
        username:
          type: string
          example: kkowalczyk
        fullname:
          type: [string, "null"]
          example: "Katarzyna Kowalczyk"
        discord_username:
          type: [string, "null"]
          example: "Kasia#5678"
        avatar_url:
          type: [string, "null"]
          example: "https://cdn.discordapp.com/avatars/123/abc.png"
        status:
          type: string
          enum: [available, on_mission]
          description: |
            Derived at query time from transfer_users → transfers → equipment_request_quests.
            `on_mission` when user is a participant in a transfer linked to an in_progress quest.
          example: on_mission
        current_mission:
          type: [string, "null"]
          description: Quest destination shown when status is on_mission.
          example: "Pawilon 5 - Sala A"

    QuestVolunteer:
      type: object
      description: Transfer participant shown on a quest response.
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: mnowak
        fullname:
          type: [string, "null"]
          example: "Marek Nowak"

    Release:
      type: object
      properties:
        id:
          type: integer
        reference:
          type: string
          example: "WYD-2026-001"
        origin_id:
          type: integer
        origin_label:
          type: [string, "null"]
          description: Origin slug
          example: "probis"
        notes:
          type: [string, "null"]
        status:
          type: string
          enum: [draft, completed]
        created_by:
          type: integer
        created_by_name:
          type: [string, "null"]
        completed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    ReleaseDetail:
      allOf:
        - $ref: "#/components/schemas/Release"
        - type: object
          required: [assets, stocks, summary]
          properties:
            assets:
              type: array
              items:
                $ref: "#/components/schemas/ReleaseAsset"
            stocks:
              type: array
              items:
                $ref: "#/components/schemas/ReleaseStock"
            summary:
              $ref: "#/components/schemas/ReleaseSummary"

    ReleaseSummary:
      type: object
      properties:
        total_assets:
          type: integer
        total_stock_quantity:
          type: integer

    ReleaseAsset:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        pyr_code:
          type: [string, "null"]
          example: "PYR-0042"
        item_serial:
          type: [string, "null"]
        category_name:
          type: [string, "null"]
          example: "Mikser audio"
        origin_label:
          type: [string, "null"]
          example: "probis"
        location_name:
          type: [string, "null"]
          example: "Magazyn główny"

    ReleaseStock:
      type: object
      properties:
        id:
          type: integer
        stock_id:
          type: integer
        item_category_id:
          type: integer
        category_name:
          type: [string, "null"]
          example: "Kabel XLR 5m"
        quantity:
          type: integer
          example: 20
        origin_label:
          type: [string, "null"]
          example: "probis"
        location_name:
          type: [string, "null"]

    SuggestResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedAsset"
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedStock"

    SuggestedAsset:
      type: object
      properties:
        id:
          type: integer
        pyr_code:
          type: [string, "null"]
        item_serial:
          type: [string, "null"]
        status:
          type: string
        category_name:
          type: [string, "null"]
        origin_label:
          type: [string, "null"]
        location_name:
          type: [string, "null"]

    SuggestedStock:
      type: object
      properties:
        id:
          type: integer
        quantity:
          type: integer
        category_name:
          type: [string, "null"]
        origin_label:
          type: [string, "null"]
        location_name:
          type: [string, "null"]

    CreateReleaseRequest:
      type: object
      required: [origin_id]
      description: At least one of `assets` / `stocks` is required.
      properties:
        origin_id:
          type: integer
          description: Origin (owner) the items are released back to
        notes:
          type: [string, "null"]
        assets:
          type: array
          items:
            type: integer
          description: Asset IDs (items table)
        stocks:
          type: array
          items:
            type: object
            required: [stock_id, quantity]
            properties:
              stock_id:
                type: integer
              quantity:
                type: integer
                minimum: 1

    UpdateItemsRequest:
      type: object
      properties:
        assets:
          type: array
          items:
            type: integer
        stocks:
          type: array
          items:
            type: object
            required: [stock_id, quantity]
            properties:
              stock_id:
                type: integer
              quantity:
                type: integer
                minimum: 1


