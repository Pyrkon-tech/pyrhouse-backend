      type: object
      properties:
        message:
          type: string

    TransferStatus:
      type: string
      enum: [in_transit, completed, cancelled]

    TransferSummary:
      type: object
      description: A transfer without its items (list endpoints)
      properties:
        id:
          type: integer
        from_location:
          $ref: "#/components/schemas/Location"
        to_location:
          $ref: "#/components/schemas/Location"
        transfer_date:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/TransferStatus"

    TransferParticipant:
      type: object
      description: A user assigned to carry out a transfer
      properties:
        id:
          type: integer
        username:
          type: string
        fullname:
          type: [string, "null"]

    DeliveryLocation:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        timestamp:
          type: string
          format: date-time

    Transfer:
      allOf:
        - $ref: "#/components/schemas/TransferSummary"
