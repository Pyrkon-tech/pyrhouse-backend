        pyr_code:
          type: string
        category_id:
          type: integer
        reserved_at:
          type: string
          format: date-time
        claimed_at:
          type: [string, "null"]
          format: date-time
        item_id:
          type: [integer, "null"]
          description: Asset created from this code

