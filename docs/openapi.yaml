  /dispatch/volunteers:
    get:
      tags:
        - dispatch
      summary: List on-duty volunteers with real-time status
      description: |
        Returns all active users enriched with a derived dispatch status.

        **Status values:**
        - `available` — user is active, not linked to any in-progress quest transfer
        - `on_mission` — user is a participant in a transfer linked to a quest with `status = in_progress`

        `current_mission` is populated only when `status = on_mission` and shows the quest's
        destination (e.g. `"Pawilon 5 - Sala A"`).

        Filter by status using comma-separated values: `?status=available,on_mission`
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: Comma-separated status filter, e.g. `available,on_mission`
          example: available,on_mission
      responses:
        "200":
          description: List of volunteers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volunteer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/DefaultError"

  /service-desk/stream:
    get:
      tags:
        - service-desk
      summary: Subscribe to real-time service desk updates (SSE)
      description: |
        Opens a Server-Sent Events connection. The server pushes a `service_desk_update`
        event whenever a request is created, updated (status / priority / assignment),
        or a comment is added.

        **Event format:**
        ```
        event: service_desk_update
        data: {"type":"request_created","request_id":42,"request_type":"hardware_issue"}
        ```

        **Event types:**

        | type | extra fields |
        |---|---|
        | `request_created` | `request_id`, `request_type` |
        | `request_updated` | `request_id`, `field` (status/assigned_to/priority), `value` |
        | `comment_added` | `request_id` |

        The connection stays open until the client disconnects.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-requests/stream:
    get:
      tags:
        - equipment-requests
      summary: Subscribe to real-time quest updates (SSE)
      description: |
        Opens a Server-Sent Events connection. The server pushes a `quest_update` event
        whenever a sync completes (manual or scheduled). The frontend should refresh the
        quest list on receiving this event.

        **Event format:**
        ```
        event: quest_update
        data: {"type":"sync_completed","stats":{"Created":2,"Updated":1,...}}
        ```

        The connection stays open until the client disconnects.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-requests/sync-status:
    get:
      tags:
        - equipment-requests
      summary: Get auto-sync scheduler status
      description: |
        Returns the current state of the auto-sync scheduler — whether it is enabled,
        its interval, when the last sync occurred, and when the next one is expected.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /origins:
    get:
      tags:
        - origins
      summary: List active origins
      description: Returns all active origins sorted by sort_order. Used to populate dropdowns on the frontend.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active origins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Origin"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - origins
      summary: Create a new origin
      description: Creates a new origin entry. Requires admin role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
                - label
              properties:
                slug:
                  type: string
                  description: URL-friendly identifier (lowercase, hyphens). Must be unique.
                  example: "new-source"
                label:
                  type: string
                  description: Human-readable display name
                  example: "New Source"
                allow_suffix:
                  type: boolean
                  description: "If true, accepts format slug-{suffix} (e.g. personal-jan)"
                  default: false
                sort_order:
                  type: integer
                  description: Display ordering (lower = first)
                  default: 0
      responses:
        "201":
          description: Origin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Origin"
        "400":
          description: Invalid request
        "409":
          description: Origin with this slug already exists
        "401":
          $ref: "#/components/responses/Unauthorized"

  /origins/all:
    get:
      tags:
        - origins
      summary: List all origins (including inactive)
      description: Returns all origins including deactivated ones. Requires moderator role. Used for admin panel.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of all origins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Origin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /origins/{id}:
    patch:
      tags:
        - origins
      summary: Update an origin
      description: Updates origin properties (label, sort_order, allow_suffix, active). Requires admin role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                allow_suffix:
                  type: boolean
                active:
                  type: boolean
                sort_order:
                  type: integer
      responses:
        "200":
          description: Origin updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Origin"
        "400":
          description: Invalid request
        "404":
          description: Origin not found
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - origins
      summary: Deactivate an origin (soft delete)
      description: Sets active=false. Existing records with this origin remain, but new records cannot use it. Requires admin role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Origin deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Origin deactivated successfully"
        "404":
          description: Origin not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /settings:
    get:
      tags:
        - settings
      summary: List all settings
      description: Returns all application settings. Optionally filter by key prefix. Values are hidden in the list view — use GET /settings/:key to read a specific value.
      parameters:
        - in: query
          name: prefix
          schema:
            type: string
          description: Filter settings by key prefix (e.g. "equipment_request")
      responses:
        "200":
          description: List of settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppSettingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /settings/{key}:
    get:
      tags:
        - settings
      summary: Get a setting by key
      description: Returns a single setting including its value.
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: Setting key (e.g. "equipment_request.sheet_id")
      responses:
        "200":
          description: Setting found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSetting"
        "404":
          description: Setting not found
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - settings
      summary: Update a setting
      description: Updates the value of an existing setting. Only existing keys can be updated.
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: Setting key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  description: New value for the setting
      responses:
        "200":
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Setting updated successfully"
        "400":
          description: Invalid request
        "404":
          description: Setting not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /releases/suggest:
    get:
      tags: [releases]
      summary: Suggest items for release by origin
      description: Returns assets and stocks matching the given origin (and optional location) that are available for permanent release.
      parameters:
        - name: origin_id
          in: query
          required: true
          schema:
            type: integer
          description: Origin ID to filter items by
        - name: location_id
          in: query
          schema:
            type: integer
          description: Optional location filter
      responses:
        "200":
          description: Suggested items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"

  /releases:
    post:
      tags: [releases]
      summary: Create a draft release
      description: Creates a new release in draft status with the selected assets and stocks. Snapshots item data at creation time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          description: Draft release created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "409":
          description: Validation error (asset in_transit, in another draft, insufficient stock)
    get:
      tags: [releases]
      summary: List releases
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, completed]
        - name: origin_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Release"

  /releases/{id}:
    get:
      tags: [releases]
      summary: Get release details (for PDF)
      description: Returns full release with asset/stock snapshots and summary. Use this for generating PDF receipts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "404":
          description: Release not found
    delete:
      tags: [releases]
      summary: Delete a draft release
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release deleted
        "409":
          description: Release not in draft status

  /releases/{id}/items:
    put:
      tags: [releases]
      summary: Update items in a draft release
      description: Replaces the complete list of assets and stocks in a draft release.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemsRequest"
      responses:
        "200":
          description: Updated release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "409":
          description: Validation error

  /releases/{id}/confirm:
    post:
      tags: [releases]
      summary: Confirm and execute release
      description: |
        Permanently removes assets from inventory and decreases stock quantities.
        Refreshes snapshots with latest data before deletion. Requires admin role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetail"
        "409":
          description: Validation error (items changed since draft creation)

servers:
  - url: https://pyrhouse-backend-f26ml.ondigitalocean.app/api
    description: Production
  - url: http://localhost:8080/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth or /auth/discord/callback

  responses:
    DefaultError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid token"

  schemas:
    AppSetting:
      type: object
      properties:
        key:
          type: string
          example: "equipment_request.sheet_id"
        value:
          type: string
          example: "16BytrbWmyWeBGnlSIDZn1Lnb5rdspoQu_rpc5m5Vtbc"
        description:
          type: string
          example: "Google Sheets document ID for equipment requests"
        updated_at:
          type: string
          format: date-time
    AppSettingSummary:
      type: object
      properties:
        key:
          type: string
          example: "equipment_request.sheet_id"
        description:
          type: string
          example: "Google Sheets document ID for equipment requests"
        updated_at:
          type: string
          format: date-time
    Origin:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
          description: URL-friendly identifier
          example: "druga-era"
        label:
          type: string
          description: Human-readable name
          example: "Druga Era"
        allow_suffix:
          type: boolean
          description: "If true, accepts slug-{suffix} format"
        active:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          example: Could not delete location
        details:
          type: string
          description: Additional technical details (optional)

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Serialized assets are not present in location
        property:
          type: string
          example: assets

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        resource_id:
          type: integer
          example: 42
        resource_type:
          type: string
          example: asset
        action:
          type: string
          example: create
          description: Action performed (e.g. create, update, delete, in_transfer, delivered)
        data:
          type: object
          additionalProperties: true
          description: Action-specific payload (msg, from_location_id, to_location_id, quantity, etc.)
          example:
            msg: "Stock item created successfully"
            quantity: 10
        created_at:
          type: string
          format: date-time
          example: "2026-02-19T12:00:00Z"

    AssetWithLogs:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            assetLogs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLog"

    StockWithLogs:
      allOf:
        - $ref: "#/components/schemas/Stock"
        - type: object
          properties:
            logs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLog"

    Item:
      type: object
      properties:
        id:
          type: integer
          example: 321
        serial:
          type: string
          example: XYZ321
        pyrcode:
          type: string
          example: PYR-LT100
          description: Auto-generated barcode identifier
        location:
          $ref: "#/components/schemas/Location"
        category:
          $ref: "#/components/schemas/ItemCategory"

    StockItem:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
          example: 4
        quantity:
          type: integer
          example: 99

    Stock:
      type: object
      properties:
        id:
          type: integer
        category:
          $ref: "#/components/schemas/ItemCategory"
        quantity:
          type: integer

    ItemCategory:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: asset
          description: Category type (asset or stock)
        name:
          type: string
          example: laptop
          description: Normalized name (auto-generated from label)
        label:
          type: string
          example: Laptop
          description: Human-readable display label

    Location:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Gzdaczroom

    Transfer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        from_location:
          $ref: "#/components/schemas/Location"
        to_location:
          $ref: "#/components/schemas/Location"
        assets_collection:
          type: array
          description: Serialized assets in the transfer
          items:
            $ref: "#/components/schemas/Item"
        stock_items_collection:
          type: array
          description: Stock items in the transfer
          items:
            $ref: "#/components/schemas/Stock"
        transfer_date:
          type: string
          format: date-time
        status:
          type: string
          description: Transfer status
          enum:
            - in_transit
            - completed
            - cancelled

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: johndoe
        fullname:
          type: string
          example: John Doe
        role:
          $ref: "#/components/schemas/Role"
        points:
          type: integer
          description: User reward points
          example: 0
        active:
          type: boolean
          description: Whether the account is active
          example: true
        discord_id:
          type: string
          nullable: true
          description: Discord user ID (if linked)
          example: "123456789012345678"
        discord_username:
          type: string
          nullable: true
          description: Discord username (if linked)
          example: "user#1234"
        avatar_url:
          type: string
          nullable: true
          description: Discord avatar URL (if linked)
          example: "https://cdn.discordapp.com/avatars/123/abc.png"
        auth_provider:
          type: string
          description: Authentication method
          enum:
            - local
            - discord
          example: local

    Role:
      type: string
      description: User permission level (hierarchical)
      enum:
        - user
        - moderator
        - admin
      example: user

    EquipmentRequestQuest:
      type: object
      description: Aggregated equipment request quest from Google Sheets form
      properties:
        id:
          type: string
          description: Generated quest ID (MD5 hash of quest key)
          example: "quest-f6c39c6c14716069"
        destination:
          $ref: "#/components/schemas/QuestDestination"
        recipient:
          type: string
          description: Person who will receive the equipment
          example: "Jan Kowalski"
        delivery_date:
          type: string
          format: date
          description: When equipment should be delivered
          example: "2025-06-13"
        pickup_time:
          type: string
          nullable: true
          description: When to pick up equipment (flexible format)
          example: "17-18"
        budget_owner:
          type: string
          description: Person responsible for budget approval
          example: "Anna Nowak"
        items:
          type: array
          description: List of requested items in this quest
          items:
            $ref: "#/components/schemas/QuestItem"
        status:
          type: string
          description: Quest processing status
          enum:
            - pending
            - in_progress
            - completed
            - cancelled
          example: "pending"
        transfer_id:
          type: integer
          nullable: true
          description: ID of the linked inventory transfer (set when transfer is created from quest)
          example: 42
        transfer_status:
          type: string
          nullable: true
          description: Status of the linked transfer (derived from transfer, not stored on quest)
          enum:
            - in_transit
            - completed
            - cancelled
          example: "in_transit"
        location_id:
          type: integer
          nullable: true
          description: Resolved location ID from pavilion+location (null if unresolved)
          example: 3
        location_resolved:
          type: boolean
          description: Whether the destination location was successfully resolved
          default: false
          example: true
        source_rows:
          type: array
          description: Source spreadsheet row numbers for debugging
          items:
            type: integer
          example: [115, 116]
        last_synced:
          type: string
          format: date-time
          description: When this quest was last synced from sheet
          example: "2026-02-15T23:40:24Z"

    QuestDestination:
      type: object
      description: Equipment delivery destination
      properties:
        pavilion:
          type: string
          description: Destination pavilion
          example: "PCC"
        location:
          type: string
          description: Specific location within pavilion
          example: "Maskarada"

    QuestItem:
      type: object
      description: Individual item in an equipment request quest
      properties:
        name:
          type: string
          description: Item name from spreadsheet
          example: "Laptop"
        quantity:
          type: integer
          minimum: 1
          description: Quantity requested
          example: 4
        category_id:
          type: integer
          nullable: true
          description: Matched item category ID (if found)
          example: 123
        category_match:
          type: string
          description: How the category was matched
          enum:
            - exact
            - fuzzy
            - manual
            - none
          example: "exact"
        category_match_confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Confidence score for fuzzy matches (0.00-1.00)
          example: 0.85
        budget_owner:
          type: string
          nullable: true
          description: Budget owner for this specific item (can differ from quest budget_owner)
          example: "Anna Nowak"
        notes:
          type: string
          nullable: true
          description: Additional notes from requestor
          example: "Must have good battery life"

    EquipmentRequestSyncLog:
      type: object
      description: Log entry for equipment request synchronization from Google Sheets
      properties:
        id:
          type: integer
          description: Log entry ID
          example: 42
        synced_at:
          type: string
          format: date-time
          description: When the sync operation completed
          example: "2026-02-16T14:30:00Z"
        rows_processed:
          type: integer
          description: Total number of spreadsheet rows processed
          example: 20
        quests_created:
          type: integer
          description: Number of new quests created during sync
          example: 5
        quests_updated:
          type: integer
          description: Number of existing quests updated during sync
          example: 3
        quests_unchanged:
          type: integer
          description: Number of quests that remained unchanged
          example: 12
        items_added:
          type: integer
          description: Total number of items added across all quests
          example: 8
        items_removed:
          type: integer
          description: Total number of items removed across all quests
          example: 2
        success:
          type: boolean
          description: Whether the sync operation completed successfully
          example: true
        duration_ms:
          type: integer
          description: How long the sync operation took in milliseconds
          example: 2350
        sheet_id:
          type: string
          description: Google Sheets spreadsheet ID that was synced
          example: "1abc123def456"
        errors:
          type: string
          description: Error messages if sync failed (empty if successful)
          example: ""

    EquipmentRequestCategoryMapping:
      type: object
      description: Manual mapping from form item name to equipment category
      properties:
        id:
          type: integer
          description: Mapping ID
          example: 15
        form_item_name:
          type: string
          description: Item name as it appears in the Google Sheets form
          example: "Laptop Dell"
        category_id:
          type: integer
          description: ID of the equipment category this maps to
          example: 123
        created_by:
          type: integer
          nullable: true
          description: User ID who created this mapping
          example: 7
        created_at:
          type: string
          format: date-time
          description: When this mapping was created
          example: "2026-02-16T10:15:00Z"

    LocationMapping:
      type: object
      description: Manual mapping from pavilion+location_name (form values) to location_id
      properties:
        id:
          type: integer
          example: 1
        pavilion:
          type: string
          example: "6"
        location_name:
          type: string
          example: "Magazyn Techniczny"
        location_id:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
        usage_count:
          type: integer
          example: 5

    SyncStatus:
      type: object
      description: Current state of the auto-sync scheduler
      properties:
        enabled:
          type: boolean
          description: Whether the scheduler is currently running
          example: true
        interval:
          type: string
          description: Sync interval as Go duration string
          example: "15m0s"
        last_sync:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last successful sync
          example: "2026-02-19T12:00:00Z"
        next_sync:
          type: string
          format: date-time
          nullable: true
          description: Estimated timestamp of the next sync (last_sync + interval)
          example: "2026-02-19T12:15:00Z"
        last_error:
          type: string
          nullable: true
          description: Error message from the last failed sync, if any
          example: "failed to fetch sheet: context deadline exceeded"

    # ── Service Desk ──────────────────────────────────────────────────────

    ServiceDeskRequest:
      type: object
      required:
        - title
        - description
        - type
        - priority
        - created_by
      properties:
        title:
          type: string
          example: "Zepsuta drukarka"
        description:
          type: string
          example: "Drukarka w sali A przestała działać"
        type:
          type: string
          enum: [hardware_issue, replacement, technical_problem, other]
          example: hardware_issue
        priority:
          type: string
          enum: [low, medium, high, urgent]
          example: medium
        created_by:
          type: string
          example: "Jan Kowalski"
        location:
          type: string
          nullable: true
          description: Free-text location. Mutually exclusive with location_id.
          example: "Pokój obok sali B"
        location_id:
          type: integer
          nullable: true
          description: ID of a known location (from GET /locations). Mutually exclusive with location.
          example: 3

    ServiceDeskRequestResponse:
      type: object
      properties:
        id:
          type: integer
          example: 42
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [hardware_issue, replacement, technical_problem, other]
        status:
          type: string
          enum: [new, in_progress, waiting, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        created_by:
          type: string
        location:
          type: string
          nullable: true
          description: Resolved location display value — location name when location_id is set, free-text otherwise.
          example: "Sala A"
        location_id:
          type: integer
          nullable: true
          description: ID of the linked location. Null when free-text was used.
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_user:
          allOf:
            - $ref: '#/components/schemas/ServiceDeskUser'
          nullable: true
        assigned_to_user:
          allOf:
            - $ref: '#/components/schemas/ServiceDeskUser'
          nullable: true

    ServiceDeskUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        fullname:
          type: string
          nullable: true

    ServiceDeskComment:
      type: object
      properties:
        id:
          type: integer
        request_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/ServiceDeskUser'

    ServiceDeskRequestType:
      type: object
      properties:
        id:
          type: string
          enum: [hardware_issue, replacement, technical_problem, other]
        name:
          type: string
        description:
          type: string

    # ── Dispatch ──────────────────────────────────────────────────────────

    Volunteer:
      type: object
      properties:
        id:
          type: integer
          description: Same as User.id — one ID system across the whole application.
          example: 4
        username:
          type: string
          example: kkowalczyk
        fullname:
          type: string
          nullable: true
          example: "Katarzyna Kowalczyk"
        discord_username:
          type: string
          nullable: true
          example: "Kasia#5678"
        avatar_url:
          type: string
          nullable: true
          example: "https://cdn.discordapp.com/avatars/123/abc.png"
        status:
          type: string
          enum: [available, on_mission]
          description: |
            Derived at query time from transfer_users → transfers → equipment_request_quests.
            `on_mission` when user is a participant in a transfer linked to an in_progress quest.
          example: on_mission
        current_mission:
          type: string
          nullable: true
          description: Quest destination shown when status is on_mission.
          example: "Pawilon 5 - Sala A"

    QuestVolunteer:
      type: object
      description: Transfer participant shown on a quest response.
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: mnowak
        fullname:
          type: string
          nullable: true
          example: "Marek Nowak"

    Release:
      type: object
      properties:
        id:
          type: integer
        reference:
          type: string
          example: "WYD-2026-001"
        origin_id:
          type: integer
          nullable: true
        origin_label:
          type: string
          nullable: true
          example: "probis"
        released_to:
          type: string
          example: "Probis Sp. z o.o."
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, completed]
        created_by:
          type: integer
        created_by_name:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ReleaseDetail:
      allOf:
        - $ref: "#/components/schemas/Release"
        - type: object
          properties:
            assets:
              type: array
              items:
                $ref: "#/components/schemas/ReleaseAsset"
            stocks:
              type: array
              items:
                $ref: "#/components/schemas/ReleaseStock"
            summary:
              type: object
              properties:
                total_assets:
                  type: integer
                total_stock_quantity:
                  type: integer

    ReleaseAsset:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        pyr_code:
          type: string
          nullable: true
          example: "PYR-0042"
        item_serial:
          type: string
          nullable: true
        category_name:
          type: string
          nullable: true
          example: "Mikser audio"
        origin_label:
          type: string
          nullable: true
          example: "probis"
        location_name:
          type: string
          nullable: true
          example: "Magazyn główny"

    ReleaseStock:
      type: object
      properties:
        id:
          type: integer
        stock_id:
          type: integer
        item_category_id:
          type: integer
        category_name:
          type: string
          nullable: true
          example: "Kabel XLR 5m"
        quantity:
          type: integer
          example: 20
        origin_label:
          type: string
          nullable: true
          example: "probis"
        location_name:
          type: string
          nullable: true

    SuggestResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              pyr_code:
                type: string
                nullable: true
              item_serial:
                type: string
                nullable: true
              status:
                type: string
              category_name:
                type: string
                nullable: true
              origin_label:
                type: string
                nullable: true
              location_name:
                type: string
                nullable: true
        stocks:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              quantity:
                type: integer
              category_name:
                type: string
                nullable: true
              origin_label:
                type: string
                nullable: true
              location_name:
                type: string
                nullable: true

    CreateReleaseRequest:
      type: object
      required: [released_to]
      properties:
        origin_id:
          type: integer
          description: Optional origin to tag this release
        released_to:
          type: string
          example: "Probis Sp. z o.o."
        notes:
          type: string
        assets:
          type: array
          items:
            type: integer
          description: Asset IDs (items table)
        stocks:
          type: array
          items:
            type: object
            required: [stock_id, quantity]
            properties:
              stock_id:
                type: integer
              quantity:
                type: integer
                minimum: 1

    UpdateItemsRequest:
      type: object
      properties:
        assets:
          type: array
          items:
            type: integer
        stocks:
          type: array
          items:
            type: object
            required: [stock_id, quantity]
            properties:
              stock_id:
                type: integer
              quantity:
                type: integer
                minimum: 1

