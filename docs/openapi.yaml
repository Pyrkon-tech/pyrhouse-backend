                $ref: "#/components/schemas/Error"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /service-desk/request-types:
    get:
      tags:
        - service-desk
      summary: Request types
      operationId: listServiceDeskRequestTypes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Types with labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceDeskRequestType"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /service-desk/stream:
    get:
      operationId: getServiceDeskStream
      tags:
        - service-desk
      summary: Subscribe to real-time service desk updates (SSE)
      description: |
        Opens a Server-Sent Events connection. The server pushes a `service_desk_update`
        event whenever a request is created, updated (status / priority / assignment),
        or a comment is added.

        **Event format:**
        ```
        event: service_desk_update
        data: {"type":"request_created","request_id":42,"request_type":"hardware_issue"}
        ```

        **Event types:**

        | type | extra fields |
        |---|---|
        | `request_created` | `request_id`, `request_type` |
        | `request_updated` | `request_id`, `field` (status/assigned_to/priority), `value` |
        | `comment_added` | `request_id` |

        The connection stays open until the client disconnects.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-requests/stream:
    get:
      operationId: getEquipmentRequestsStream
      tags:
        - equipment-requests
      summary: Subscribe to real-time quest updates (SSE)
      description: |
        Opens a Server-Sent Events connection. The server pushes a `quest_update` event
        when something the quest board depends on changes.

        **Event format:**
        ```
        event: quest_update
        data: {"type":"stocks_changed","location_id":3,"action":"updated"}
        ```

        | type | extra fields |
        |---|---|
        | `quests_changed` | — (quests created or moved outside the board, e.g. a shop order confirmed) |
        | `stocks_changed` | `location_id`, `action` (created/updated/deleted) |

        The connection stays open until the client disconnects.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-requests/budget:
    get:
      operationId: getEquipmentRequestsBudget
      tags:
        - equipment-requests
      summary: Get budget summary (Zapotrzebowanie techniczne)
      description: |
        **Requires admin role.**
        Aggregates quest items by name, joins all supplier prices dynamically, and returns
        per-item supplier breakdown and grand totals per supplier.
        Any number of suppliers is supported — no schema change needed for new ones.
        Pass vat=true to get gross prices (net × 1.23).
      security:
        - bearerAuth: []
      parameters:
        - name: budget_owner
          in: query
          required: false
          schema:
            type: string
          description: Filter by person responsible for budget (case-insensitive). Empty = all.
        - name: vat
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, multiply all prices by 1.23 (gross with 23% VAT).
      responses:
        "200":
          description: Budget summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /equipment-requests/budget/persons:
    get:
      operationId: getEquipmentRequestsBudgetPersons
      tags:
        - equipment-requests
      summary: List distinct budget owners
      description: |
        **Requires admin role.**
        Returns distinct non-empty budget_owner values from quests for the person filter dropdown.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of persons
          content:
            application/json:
              schema:
                type: object
                properties:
                  persons:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /equipment-requests/suppliers:
    get:
      operationId: getEquipmentRequestsSuppliers
      tags:
        - equipment-requests
      summary: List known suppliers
      description: |
        **Requires admin role.**
        Returns the distinct supplier names that have at least one price entry.
        Use this to build dynamic column headers in the frontend.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppliers:
                    type: array
                    items:
                      type: string
                    example: ["Netland", "Oki-event", "Probis"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /equipment-requests/prices:
    get:
      operationId: getEquipmentRequestsPrices
      tags:
        - equipment-requests
      summary: List price list entries
      description: |
        **Requires admin role.**
        Returns all (item_name, supplier, unit_price) rows, sorted by item_name then supplier.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Price list
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items:
                      $ref: "#/components/schemas/PriceListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putEquipmentRequestsPrices
      tags:
        - equipment-requests
      summary: Create or update a price entry
      description: |
        **Requires admin role.**
        Upserts the unit_price for (item_name, supplier). To add a new supplier just use its name — no schema change required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPriceRequest"
      responses:
        "200":
          description: Price saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEquipmentRequestsPrices
      tags:
        - equipment-requests
      summary: Delete a price entry
      description: "**Requires admin role.** Deletes the row for the given (item_name, supplier) combination."
      security:
        - bearerAuth: []
      parameters:
        - name: item_name
          in: query
          required: true
          schema:
            type: string
          example: "Laptop"
        - name: supplier
          in: query
          required: true
          schema:
            type: string
          example: "Probis"
      responses:
        "200":
          description: Price deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /origins:
    get:
      operationId: getOrigins
      tags:
        - origins
      summary: List active origins
      description: Returns all active origins sorted by sort_order. Used to populate dropdowns on the frontend.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active origins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Origin"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postOrigins
      tags:
        - origins
      summary: Create a new origin
      description: Creates a new origin entry. Requires admin role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
                - label
              properties:
                slug:
                  type: string
                  description: URL-friendly identifier (lowercase, hyphens). Must be unique.
                  example: "new-source"
                label:
                  type: string
                  description: Human-readable display name
                  example: "New Source"
                allow_suffix:
                  type: boolean
                  description: "If true, accepts format slug-{suffix} (e.g. personal-jan)"
                  default: false
                sort_order:
                  type: integer
                  description: Display ordering (lower = first)
                  default: 0
      responses:
        "201":
          description: Origin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Origin"
        "400":
          description: Invalid request
        "409":
          description: Origin with this slug already exists
        "401":
          $ref: "#/components/responses/Unauthorized"

  /origins/all:
    get:
      operationId: getOriginsAll
