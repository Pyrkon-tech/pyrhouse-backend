  /equipment-requests/quests:
    get:
      operationId: getEquipmentRequestsQuests
      tags:
        - equipment-requests
      summary: List equipment request quests from database
      description: |
        Returns quests from database with optional filtering and pagination.

        **Phase 2:** Database-backed with pagination and status filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by quest status
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
            example: "pending"
        - name: limit
          in: query
          required: false
          description: Maximum number of quests to return (max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
            example: 50
        - name: offset
          in: query
          required: false
          description: Number of quests to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200":
          description: List of quests with pagination info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-requests/quests/{id}:
    get:
      operationId: getEquipmentRequestsQuestsById
      tags:
        - equipment-requests
      summary: Get single quest by ID
      description: Retrieves details of a specific equipment request quest by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID (generated hash)
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
      responses:
        "200":
          description: Quest details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentRequestQuest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Quest not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Quest not found"

  /equipment-requests/quests/{id}/status:
    patch:
      operationId: updateQuestStatus
      tags:
        - equipment-requests
      summary: Update quest status
      description: |
        Updates the status of an equipment request quest.

        Valid statuses: pending, in_progress, completed, cancelled

        **Important:** If the quest is linked to a transfer (transfer_id is not null),
        manual status changes are rejected with 409 Conflict. Use transfer endpoints
        (confirm/cancel) instead — quest status is automatically synced from transfer.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                  example: "in_progress"
      responses:
        "200":
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quest status updated successfully"
                  status:
                    type: string
                    example: "in_progress"
        "400":
          description: Invalid status value
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Quest is linked to a transfer — manual status changes not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Quest status is managed by linked transfer"
                  details:
                    type: string
                    example: "Quest is linked to transfer 42. Use transfer endpoints to change status."
        "500":
          $ref: "#/components/responses/DefaultError"

  /equipment-requests/quests/{id}/transfer:
    post:
      operationId: postEquipmentRequestsQuestsByIdTransfer
      tags:
        - equipment-requests
      summary: Create transfer from quest
      description: |
        Creates an inventory transfer from an equipment request quest.

        The quest must be in 'pending' status and not already linked to a transfer.
        Resolves destination location from quest pavilion+location if to_location_id is not provided.
        Resolves stock items from quest item categories if stock_items are not provided.

        On success, the quest status changes to 'in_progress' and transfer_id is set.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_location_id
              properties:
                from_location_id:
                  type: integer
                  description: Source warehouse location ID
                  example: 1
                to_location_id:
                  type: [integer, "null"]
                  description: Destination location ID (defaults to the quest's stored location_id; 422 if the quest has none)
                  example: 5
                stock_items:
                  type: array
                  description: Stock items to transfer — the server never picks them; use transfer-preview for suggestions. At least one stock item or asset is required.
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                    properties:
                      id:
                        type: integer
                        description: Non-serialized stock item ID
                      quantity:
                        type: integer
                        minimum: 1
                assets:
                  type: array
                  description: Serialized assets to include in transfer
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        description: Serialized asset item ID
                users:
                  type: array
                  description: Users assigned to delivery
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
      responses:
        "201":
          description: Transfer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transfer created from quest successfully"
                  transfer_id:
                    type: integer
                    example: 42
                  quest_id:
                    type: string
                    example: "quest-f6c39c6c14716069"
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Quest not found
        "409":
          description: Quest is completed or cancelled (a quest may have several transfers)
        "422":
          description: No destination (no to_location_id and the quest has no location) or no stock items / assets in the request

  /equipment-requests/quests/{id}/transfer-preview:
    get:
      operationId: getEquipmentRequestsQuestsByIdTransferPreview
      tags:
        - equipment-requests
      summary: Preview transfer from quest
      description: |
        Shows what a transfer created from this quest would look like.
        Resolves destination location and stock items without creating anything.
        Useful for the frontend to pre-populate a "create transfer" form.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quest ID
          schema:
            type: string
            example: "quest-f6c39c6c14716069"
        - name: from_location_id
          in: query
          required: true
          description: Source warehouse location ID to resolve stock from
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Transfer preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_location_id:
                    type: integer
                    example: 1
                  to_location_id:
                    type: [integer, "null"]
                    example: 5
                  to_location_name:
                    type: string
                    example: "Maskarada"
                  resolved_items:
                    type: array
                    items:
                      type: object
                      properties:
                        stock_id:
                          type: integer
                        category_id:
                          type: integer
                        category_name:
                          type: string
                        item_name:
                          type: string
                        quantity:
                          type: integer
                        available:
                          type: integer
                  unresolved_items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_name:
                          type: string
                        quantity:
                          type: [integer, "null"]
                          description: Null when the item has no quantity (reason "quantity not specified")
                        category_id:
                          type: [integer, "null"]
                        reason:
                          type: string
        "400":
          description: Missing from_location_id parameter
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Quest not found

