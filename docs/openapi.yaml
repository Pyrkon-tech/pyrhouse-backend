    get:
      operationId: getShopCatalog
      tags:
        - shop
      summary: Active products
      description: Ordered by section, sort order and name. `price` is null for every product when prices are hidden.
      security:
        - shopBearerAuth: []
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"
        "401":
          $ref: "#/components/responses/ShopError"

  /shop/locations:
