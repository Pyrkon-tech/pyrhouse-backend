        assignment_b:
          $ref: "#/components/schemas/AssignmentDetail"

    CreateSlotRequest:
      type: object
      required: [type, start, end]
      properties:
        type:
          $ref: "#/components/schemas/SlotType"
        start:
          type: string
        end:
          type: string
        capacity:
          type: integer
        label:
          type: [string, "null"]

    UpdateSlotRequest:
      type: object
      required: []
      properties:
        type:
          $ref: "#/components/schemas/SlotType"
        start:
          type: string
        end:
          type: string
        capacity:
          type: integer
        label:
          type: [string, "null"]

    DraftSlot:
      type: object
      required: [type, start, end]
      description: Existing slot (`id`) or a new one (`temp_id`)
      properties:
        id:
          type: integer
        temp_id:
          type: string
        type:
          $ref: "#/components/schemas/SlotType"
        start:
          type: string
        end:
          type: string
        capacity:
          type: integer
        label:
          type: [string, "null"]

    DraftAssignment:
