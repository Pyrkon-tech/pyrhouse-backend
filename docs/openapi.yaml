openapi: 3.1.0
info:
  title: PyrHouse API
  description: Warehouse inventory management system API for tracking assets, stock items, locations, and transfers.
  version: 0.1.0
  contact:
    email: warrmag7@gmail.com
  license:
    name: MIT

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication and authorization (JWT, Discord OAuth2)
  - name: items
    description: Combined inventory item queries (assets + stock)
  - name: asset
    description: Serialized asset management (tracked by serial/PYR code)
  - name: stock
    description: Non-serialized stock item management (tracked by quantity)
  - name: item category
    description: Item category management
  - name: location
    description: Storage location management
  - name: transfer
    description: Asset and stock transfers between locations
  - name: users
    description: User account management and RBAC
  - name: equipment-requests
    description: Equipment request form integration - Google Sheets sync and quest aggregation
  - name: origins
    description: Origin management — predefined and custom asset/stock sources
  - name: settings
    description: Application settings management (admin only)
  - name: service-desk
    description: Service desk request management
  - name: dispatch
    description: Dispatch map — volunteer status and quest assignment
  - name: releases
    description: Permanent inventory releases — remove items from stock with a receipt for PDF generation

paths:
  /health:
    get:
      tags:
        - utility
      summary: Health check
      description: Returns application health status, uptime, and version.
      security: []
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth:
    post:
      tags:
        - auth
      summary: Authenticate with credentials
      description: Authenticates a user with username and password, returns a JWT token. Rate limited to 7 attempts per 5 minutes per IP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        "201":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/discord:
    get:
      tags:
        - auth
      summary: Initiate Discord OAuth2 login
      description: |
        Redirects the user to the Discord authorization page.
        After successful authorization, Discord redirects back to `/auth/discord/callback`.
        A CSRF state token is stored in a cookie for verification.
      operationId: discordLogin
      security: []
      responses:
        "307":
          description: Redirect to Discord OAuth authorization page
          headers:
            Location:
              schema:
                type: string
              description: Discord authorization URL

  /auth/discord/callback:
    get:
      tags:
        - auth
      summary: Discord OAuth2 callback
      description: |
        Callback endpoint invoked by Discord after user authorization.
        Exchanges the authorization code for an access token, fetches user data, and creates or finds the user.

        **Behavior depends on configuration:**
        - If `FRONTEND_URL` is set: redirects to frontend with token or error as query parameter
          - Success: `{FRONTEND_URL}?token=eyJhbG...`
          - Error: `{FRONTEND_URL}?error=Account+is+inactive`
        - If `FRONTEND_URL` is not set: returns JSON response

        **Auto-linking:** If an account with the same username exists (not linked to Discord),
        it will be automatically linked to the Discord account.

        New Discord users are created with `active=false` and require manual activation by an admin.
      operationId: discordCallback
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: true
          description: Authorization code from Discord
        - in: query
          name: state
          schema:
            type: string
          required: true
          description: State parameter for CSRF protection
      responses:
        "307":
          description: Redirect to frontend (when FRONTEND_URL is configured)
          headers:
            Location:
              schema:
                type: string
              description: Frontend URL with token or error query parameter
        "200":
          description: Login successful (fallback when FRONTEND_URL is not set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
        "400":
          description: Invalid state parameter or missing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /items/{category}/{id}:
    get:
      tags:
        - items
      summary: Get single item with history
      description: |
        Returns a single item (asset or stock) along with its audit log history.

        - `category=asset` → returns asset fields + `assetLogs`
        - `category=stock` → returns stock item fields + `logs`
      operationId: getItem
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            enum: [asset, stock]
          description: Item type
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Item ID
      responses:
        "200":
          description: Item with audit log history
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AssetWithLogs"
                  - $ref: "#/components/schemas/StockWithLogs"
        "400":
          description: Invalid URI parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /items:
    get:
      tags:
        - items
      summary: List all inventory items
      description: Returns a combined array of serialized assets and non-serialized stock items. Supports filtering by location, category, and type.
      operationId: listItems
      parameters:
        - in: query
          name: location_ids
          schema:
            type: array
            items:
              type: integer
          description: Filter by location IDs
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter by category ID
        - in: query
          name: category_type
          schema:
            type: string
            enum: [asset, stock]
          description: Filter by item type (asset or stock)
        - in: query
          name: category_label
          schema:
            type: string
          description: Filter by category label
      responses:
        "200":
          description: Combined list of assets and stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Item"
                    - $ref: "#/components/schemas/StockItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /assets:
    post:
      tags:
        - asset
      summary: Create a new asset
      description: Creates a new serialized asset with a unique serial number. A PYR code is automatically generated.
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serial
                - category_id
                - origin
              properties:
                serial:
                  type: string
                  description: Unique serial number
                category_id:
                  type: integer
                  description: Category ID for this asset
                origin:
                  type: string
                  description: "Origin string — validated against the origins table. Use GET /origins to list available values. For origins with allow_suffix=true (e.g. personal, other), append a suffix with a hyphen (e.g. personal-jan)."
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /assets/pyrcode/{pyrcode}:
    get:
      tags:
        - asset
      summary: Get asset by PYR code
      description: Retrieves a single asset by its PYR code (barcode value).
      operationId: getAssetByPyrcode
      parameters:
        - in: path
          name: pyrcode
          schema:
            type: string
          required: true
          description: PYR code value (e.g. PYR-LT123)
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Asset not found

  /assets/bulk:
    post:
      tags:
        - asset
      summary: Bulk create assets
      description: Creates multiple assets with the same category, location, and status.
      operationId: bulkCreateAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serials
                - category_id
                - origin
              properties:
                serials:
                  type: array
                  items:
                    type: string
                  description: List of serial numbers
                location_id:
                  type: integer
                  description: Location ID (defaults to 1)
                status:
                  type: string
                  description: Asset status (defaults to "available")
                category_id:
                  type: integer
                  description: Category ID for all assets
                origin:
                  type: string
                  description: "Origin string — validated against the origins table. Use GET /origins to list available values."
      responses:
        "201":
          description: Assets created (may include partial errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  errors:
                    type: array
                    items:
                      type: string
                    description: Errors for individual assets that failed creation
        "400":
          description: Invalid request payload or category type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/{assetID}:
    delete:
      tags:
        - asset
      summary: Delete an asset
      description: Deletes an asset by ID. Fails if the asset is currently in transit or unavailable.
      operationId: deleteAsset
      parameters:
        - in: path
          name: assetID
          schema:
            type: integer
          required: true
          description: Asset ID
      responses:
        "200":
          description: Asset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "409":
          description: Cannot delete - asset is in transit or unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /stocks:
    post:
      tags:
        - stock
      summary: Create a stock item
      description: Creates a non-serialized stock item tracked by quantity.
      operationId: createStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category_id
                - quantity
              properties:
                category_id:
                  type: integer
                  example: 4
                  description: Category ID for this stock item
                quantity:
                  type: integer
                  example: 99
                  description: Initial quantity
      responses:
        "201":
          description: Stock item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
        "500":
          $ref: "#/components/responses/DefaultError"

  /locations:
    post:
      tags:
        - location
      summary: Create a new location
      description: Creates a new storage location.
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid payload
        "409":
          description: Location name already taken

  /locations/{locationID}/assets:
    get:
      tags:
        - location
      summary: Get items in location
      description: Returns all assets and stock items stored in the specified location.
      operationId: getLocationItems
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
      responses:
        "200":
          description: Items in location
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  stock_items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stock"
        "500":
          $ref: "#/components/responses/DefaultError"

  /locations/{locationID}:
    delete:
      tags:
        - location
      summary: Delete a location
      description: Deletes a location by ID. Fails if the location still contains items.
      operationId: deleteLocation
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
      responses:
        "200":
          description: Location deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Location deleted successfully
        "409":
          description: Cannot delete - location still contains items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /locations/{locationID}/search:
    get:
      tags:
        - location
      summary: Search items in location
      description: Search for items in a specific location by serial number, category name, or category label.
      operationId: searchLocationItems
      parameters:
        - in: path
          name: locationID
          schema:
            type: integer
          required: true
          description: Location ID
        - in: query
          name: q
          schema:
            type: string
          required: true
          description: Search query (minimum 1 character)
      responses:
        "200":
          description: Matching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers:
    get:
      tags:
        - transfer
      summary: List all transfers
      description: Returns a list of all transfers in the system.
      operationId: listTransfers
      responses:
        "200":
          description: List of transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
        "500":
          $ref: "#/components/responses/DefaultError"
    post:
      tags:
        - transfer
      summary: Create a new transfer
      description: Creates a new transfer of assets and stock items between locations.
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_location_id
                - location_id
              properties:
                from_location_id:
                  type: integer
                  example: 1
                  description: Source location ID
                location_id:
                  type: integer
                  example: 2
                  description: Destination location ID
                asset_item_collection:
                  type: array
                  description: Collection of serialized assets to transfer
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Asset ID
                stock_item_collection:
                  type: array
                  description: Collection of stock items to transfer
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Stock item ID
                      quantity:
                        type: integer
                        format: int32
                        description: Quantity to transfer
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Warehouse validation failed (items not in source location)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Warehouse equipment validation failed
                  reasons:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidationError"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}:
    get:
      tags:
        - transfer
      summary: Get transfer details
      description: Returns detailed information about a transfer by ID.
      operationId: getTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      responses:
        "200":
          description: Transfer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          description: Invalid transfer ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}/confirm:
    patch:
      tags:
        - transfer
      summary: Confirm a transfer
      description: Confirms a transfer and updates asset locations to the destination.
      operationId: confirmTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      responses:
        "200":
          description: Transfer confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer_id:
                    type: integer
                    example: 3
                  status:
                    type: string
                    example: completed
                  message:
                    type: string
                    example: Transfer confirmed successfully
        "500":
          description: Unable to confirm transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfers/{transferID}/cancel:
    patch:
      tags:
        - transfer
      summary: Cancel a transfer
      description: Cancels a transfer and restores all assets and stock items to their original location.
      operationId: cancelTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      responses:
        "200":
          description: Transfer cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer_id:
                    type: integer
                    example: 3
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                    example: Transfer cancelled successfully
        "500":
          description: Unable to cancel transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfers/{transferID}/assets/{itemID}/restore-to-location:
    patch:
      tags:
        - transfer
      summary: Remove asset from transfer
      description: Removes an asset from a transfer and restores it to the specified location.
      operationId: restoreAssetFromTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
        - in: path
          name: itemID
          schema:
            type: integer
          required: true
          description: Asset ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location_id
              properties:
                location_id:
                  type: integer
                  example: 1
                  description: Location ID to restore the asset to
      responses:
        "200":
          description: Asset removed from transfer
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer_id:
                    type: integer
                    example: 3
        "400":
          description: Invalid request (missing location_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /transfers/{transferID}/categories/{categoryID}/restore-to-location:
    patch:
      tags:
        - transfer
      summary: Remove stock item from transfer
      description: Removes a stock item from a transfer and restores the specified quantity to a location.
      operationId: restoreStockFromTransfer
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
        - in: path
          name: categoryID
          schema:
            type: integer
          required: true
          description: Stock item category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location_id
                - quantity
              properties:
                location_id:
                  type: integer
                  example: 1
                  description: Location ID to restore stock to
                quantity:
                  type: integer
                  example: 32
                  description: Quantity to restore
      responses:
        "200":
          description: Stock item removed from transfer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Stock item removed from transfer successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to remove stock item from transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfers/{transferID}/delivery-location:
    patch:
      tags:
        - transfer
      summary: Update transfer delivery location
      description: Updates the GPS delivery location for an in-transit or completed transfer.
      operationId: updateDeliveryLocation
      parameters:
        - in: path
          name: transferID
          schema:
            type: integer
          required: true
          description: Transfer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delivery_location
              properties:
                delivery_location:
                  type: object
                  required:
                    - lat
                    - lng
                    - timestamp
                  properties:
                    lat:
                      type: number
                      format: float
                      description: Latitude
                      example: 50.00366850638076
                    lng:
                      type: number
                      format: float
                      description: Longitude
                      example: 20.235703352753667
                    timestamp:
                      type: string
                      format: date-time
                      description: Delivery timestamp
                      example: "2025-04-18T21:43:12.473Z"
      responses:
        "200":
          description: Delivery location updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Delivery location updated successfully
        "400":
          description: Invalid request (only in-transit or completed transfers can be updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/DefaultError"

  /items/categories:
    get:
      tags:
        - item category
      summary: List all categories
      description: Returns all item categories.
      operationId: listCategories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemCategory"
    post:
      tags:
        - item category
      summary: Create a category
      description: Creates a new item category. Name and PYR ID are auto-generated from the label.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - label
              properties:
                type:
                  type: string
                  example: laptop
                  description: Category type identifier
                label:
                  type: string
                  example: Laptop
                  description: Human-readable category label
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCategory"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /items/categories/{categoryID}:
    delete:
      tags:
        - item category
      summary: Delete a category
      description: Deletes an item category by ID. Fails if items still reference this category.
      operationId: deleteCategory
      parameters:
        - in: path
          name: categoryID
          schema:
            type: integer
          required: true
          description: Category ID
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "409":
          description: Cannot delete - category is still referenced by items
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /users:
    post:
      tags:
        - users
      summary: Create a user
      description: Creates a new user account. Requires admin role.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                  example: johndoe
                password:
                  type: string
                  example: password123
                fullname:
                  type: string
                  example: John Doe
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
        "400":
          description: Invalid request payload
          content:
