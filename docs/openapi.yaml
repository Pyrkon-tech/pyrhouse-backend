  /shop/budget-owners:
    get:
      operationId: getShopBudgetOwners
      tags:
        - shop
      summary: Budget owner suggestions
      description: The account's own earlier `budget_owner` values, most recent first (max 20). Never other accounts' values.
      security:
        - shopBearerAuth: []
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/ShopError"

  /shop/orders:
    get:
      operationId: getShopOrders
      tags:
        - shop
      summary: My orders
      security:
        - shopBearerAuth: []
      responses:
        "200":
          description: The account's orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopOrder"
        "401":
          $ref: "#/components/responses/ShopError"
    post:
      operationId: postShopOrders
      tags:
        - shop
      summary: Submit an order
      description: |
        Validated on the server: orders open, products active, `max_per_order`, delivery window
        active and in the future, return window active and not before the delivery window ends,
        `return_date` (optional) within the return window, location exists.
        Send an `Idempotency-Key` header; repeating it returns the original order with 200.
      security:
        - shopBearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "200":
          description: Same Idempotency-Key — the original order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "400":
          $ref: "#/components/responses/ShopError"
        "403":
          description: Orders closed (`orders_closed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopError"

  /shop/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/ShopOrderID"
    get:
      operationId: getShopOrdersById
      tags:
        - shop
      summary: My order
      description: Another account's order is a 404.
      security:
        - shopBearerAuth: []
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "404":
          $ref: "#/components/responses/ShopError"
    put:
      operationId: putShopOrdersById
      tags:
        - shop
      summary: Edit my order
      description: Only while `submitted`. `version` must match the current one (409 `version_conflict` otherwise).
      security:
        - shopBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ShopOrderInput"
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "400":
          $ref: "#/components/responses/ShopError"
        "404":
          $ref: "#/components/responses/ShopError"
        "409":
          $ref: "#/components/responses/ShopError"

  /shop/orders/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ShopOrderID"
    post:
      operationId: postShopOrdersByIdCancel
      tags:
        - shop
      summary: Cancel my order
      description: Only while `submitted`.
      security:
        - shopBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopVersionInput"
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "404":
          $ref: "#/components/responses/ShopError"
        "409":
          $ref: "#/components/responses/ShopError"

  # ==========================================================================
  # Shop panel in the warehouse — warehouse JWT, moderator (settings: admin)
  # ==========================================================================

  /admin/shop/products:
    get:
      operationId: getAdminShopProducts
      tags:
        - shop-admin
      summary: All products (including inactive)
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAdminShopProducts
      tags:
        - shop-admin
      summary: Create a product
      description: The product is tied to an existing item category; create a new category with `POST /categories` first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
        "400":
          $ref: "#/components/responses/ShopError"

  /admin/shop/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ShopResourceID"
    put:
      operationId: putAdminShopProductsById
      tags:
        - shop-admin
      summary: Update a product
      description: There is no delete — set `active` to false. Existing orders keep their name/price snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
        "400":
          $ref: "#/components/responses/ShopError"
        "404":
          $ref: "#/components/responses/ShopError"

  /admin/shop/delivery-windows:
    get:
      operationId: getAdminShopDeliveryWindows
      tags:
        - shop-admin
      summary: All delivery and return windows
      responses:
        "200":
          description: Windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopWindow"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAdminShopDeliveryWindows
      tags:
        - shop-admin
      summary: Create a window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopWindowInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopWindow"
        "400":
          $ref: "#/components/responses/ShopError"

  /admin/shop/delivery-windows/{id}:
    parameters:
      - $ref: "#/components/parameters/ShopResourceID"
    put:
      operationId: putAdminShopDeliveryWindowsById
      tags:
        - shop-admin
      summary: Update a window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopWindowInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopWindow"
        "404":
          $ref: "#/components/responses/ShopError"
    delete:
      operationId: deleteAdminShopDeliveryWindowsById
      tags:
        - shop-admin
      summary: Delete a window
      description: 409 `window_in_use` when orders use it — deactivate it instead.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/ShopError"
        "409":
          $ref: "#/components/responses/ShopError"

  /admin/shop/orders:
    get:
      operationId: getAdminShopOrders
      tags:
        - shop-admin
      summary: All orders
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [submitted, confirmed, rejected, cancelled]
      responses:
        "200":
          description: Orders, newest first (prices always included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/shop/orders/summary:
    get:
      operationId: getAdminShopOrdersSummary
      tags:
        - shop-admin
      summary: What to prepare — submitted and confirmed orders aggregated
      parameters:
        - in: query
          name: group
          schema:
            type: string
            enum: [product, day, location]
            default: product
        - in: query
          name: status
          description: "`confirmed` = confirmed orders only; default = submitted and confirmed"
          schema:
            type: string
            enum: [confirmed]
      responses:
        "200":
          description: Rows grouped by the key and product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/shop/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/ShopOrderID"
    get:
      operationId: getAdminShopOrdersById
      tags:
        - shop-admin
      summary: Order with its event log
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrderDetail"
        "404":
          $ref: "#/components/responses/ShopError"
    patch:
      operationId: patchAdminShopOrdersById
      tags:
        - shop-admin
      summary: Correct an order
      description: |
        `items` only while `submitted` (moderators may use inactive products and exceed `max_per_order`).
        `location_id` also after confirmation — the quest moves with it in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                location_id:
                  type: integer
                location_note:
                  type: [string, "null"]
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ShopOrderItemInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "400":
          $ref: "#/components/responses/ShopError"
        "404":
          $ref: "#/components/responses/ShopError"
        "409":
          $ref: "#/components/responses/ShopError"

  /admin/shop/orders/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ShopOrderID"
    post:
      operationId: postAdminShopOrdersByIdConfirm
      tags:
        - shop-admin
      summary: Confirm an order ("Zamówione")
      description: |
        In one transaction: status `confirmed`, a quest with `source: shop` (exact category and
        location), an event. A second confirm is 409 `already_confirmed`. Broadcasts
        `quests_changed` on `/equipment-requests/stream`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopVersionInput"
      responses:
        "200":
          description: Confirmed order (`quest_id` set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "404":
          $ref: "#/components/responses/ShopError"
        "409":
          $ref: "#/components/responses/ShopError"

  /admin/shop/orders/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ShopOrderID"
    post:
      operationId: postAdminShopOrdersByIdReject
      tags:
        - shop-admin
      summary: Reject an order
      description: The reason is shown to the organizer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                reason:
                  type: string
      responses:
        "200":
          description: Rejected order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "400":
          $ref: "#/components/responses/ShopError"
        "409":
          $ref: "#/components/responses/ShopError"

  /admin/shop/accounts:
    get:
      operationId: getAdminShopAccounts
      tags:
        - shop-admin
      summary: Shop accounts (including allowlist entries that never logged in)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAdminShopAccounts
      tags:
        - shop-admin
      summary: Add an e-mail to the allowlist
      description: The first Google login with this e-mail binds the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Allowlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopAccount"
        "409":
          $ref: "#/components/responses/ShopError"

  /admin/shop/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ShopResourceID"
    patch:
      operationId: patchAdminShopAccountsById
      tags:
        - shop-admin
      summary: Block or unblock an account
      description: Takes effect on the account's next request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopAccount"
        "404":
          $ref: "#/components/responses/ShopError"

  /admin/shop/invites:
    get:
      operationId: getAdminShopInvites
      tags:
        - shop-admin
      summary: Invites (tokens are never listed)
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAdminShopInvites
      tags:
        - shop-admin
      summary: Create a one-time invite (valid 48 h)
      description: The plaintext `token` and `url` are returned only here; the server stores a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  example: "Jan — Gamesroom"
      responses:
        "201":
          description: Invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopInviteCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/shop/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/ShopResourceID"
    delete:
      operationId: deleteAdminShopInvitesById
      tags:
        - shop-admin
      summary: Revoke an invite
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/ShopError"
        "409":
          description: Already used or revoked (`invite_closed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopError"

  /admin/shop/settings:
    get:
      operationId: getAdminShopSettings
      tags:
        - shop-admin
      summary: Shop settings (admin)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putAdminShopSettings
      tags:
        - shop-admin
      summary: Update shop settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSettings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
        "400":
          $ref: "#/components/responses/ShopError"

servers:
  - url: https://pyrhouse-backend-f26ml.ondigitalocean.app/api
    description: Production
  - url: http://localhost:8081
    description: Local development (`make dev`; no /api prefix — DigitalOcean routing adds it in production)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth or /auth/discord/callback
    shopBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Shop token (aud=pyrhouse-shop) from /shop/auth/google/exchange. Warehouse tokens are rejected on /shop/*, shop tokens everywhere else.

  parameters:
    ShopOrderID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Shop order ID
    ShopResourceID:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    ScheduleInternalError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleError"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ShopError:
      description: Shop error with a stable `code`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ShopError"
    DefaultError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid token"

  schemas:
    ShopError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable message (Polish)
        code:
          type: string
          description: Stable machine code, e.g. `version_conflict`, `orders_closed`, `access_denied`
          example: version_conflict
        details:
          type: string

    ShopAccount:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
        active:
          type: boolean
        access_source:
          type: string
          enum: [domain, allowlist, invite]
        logged_in:
          type: boolean
          description: false for an allowlist entry that has not logged in yet
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        orders_count:
          type: integer

    ShopProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        section:
          type: string
        sort_order:
          type: integer
        category_id:
          type: integer
        category_name:
          type: [string, "null"]
          description: Panel only (null for organizers)
        price:
          type: [number, "null"]
          description: Null when the product has no price or prices are hidden from organizers
        max_per_order:
          type: [integer, "null"]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ShopProductInput:
      type: object
      required: [name, category_id]
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          description: Must start with https://
        section:
          type: string
        sort_order:
          type: integer
        category_id:
          type: integer
        price:
          type: [number, "null"]
          minimum: 0
        max_per_order:
          type: [integer, "null"]
          minimum: 1
        active:
          type: boolean
          default: true

    ShopWindow:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [delivery, return]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        label:
          type: string
          example: "czw 15.07 16–20"
        active:
          type: boolean
        orders_count:
          type: integer
          description: Panel only — submitted and confirmed orders using this window (0 for organizers)

    ShopWindowInput:
      type: object
      required: [kind, starts_at, ends_at]
      properties:
        kind:
          type: string
          enum: [delivery, return]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        label:
          type: string
        active:
          type: boolean
          default: true

    ShopLocation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pavilion:
          type: [string, "null"]

    ShopOrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1

    ShopOrderInput:
      type: object
      required: [location_id, delivery_window_id, return_window_id, items]
      properties:
        location_id:
          type: integer
        location_note:
          type: [string, "null"]
        contact_name:
          type: string
          description: Recipient; empty or missing = the account's Google name (else its e-mail)
        budget_owner:
          type: [string, "null"]
        delivery_window_id:
          type: integer
        return_window_id:
          type: integer
        return_date:
          type: [string, "null"]
          format: date
          description: Optional exact return day; must fall within the return window (Europe/Warsaw days)
        notes:
          type: [string, "null"]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ShopOrderItemInput"

    ShopVersionInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer

    ShopOrderItem:
      type: object
      properties:
        product_id:
          type: integer
        product_name:
          type: string
          description: Snapshot taken when the order was submitted or edited
        category_id:
          type: integer
        category_name:
          type: [string, "null"]
          description: Panel only (null for organizers)
        quantity:
          type: integer
        unit_price:
          type: [number, "null"]
          description: Price snapshot; null when the product had no price or prices are hidden

    ShopOrder:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          example: "SKL-0042"
        account_id:
          type: integer
        account_email:
          type: string
        account_name:
          type: [string, "null"]
          description: Organizer's Google name, when known
        location:
          $ref: "#/components/schemas/ShopLocation"
        location_note:
          type: [string, "null"]
        contact_name:
          type: string
        budget_owner:
          type: [string, "null"]
        delivery_window:
          $ref: "#/components/schemas/ShopWindow"
        return_window:
          $ref: "#/components/schemas/ShopWindow"
        return_date:
          type: [string, "null"]
          format: date
        notes:
          type: [string, "null"]
        status:
          type: string
          enum: [submitted, confirmed, rejected, cancelled]
        status_reason:
          type: [string, "null"]
          description: Rejection reason, shown to the organizer
        decided_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          description: Optimistic lock — send it back with edits and decisions
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShopOrderItem"
        total:
          type: [number, "null"]
          description: Sum of priced items; null when prices are hidden or nothing is priced
        quest_id:
          type: [string, "null"]
          description: Quest created on confirmation
        quest_status:
          type: [string, "null"]
          enum: [pending, in_progress, completed, cancelled, null]
          description: Fulfillment after confirmation, derived from the quest
        changed_by_warehouse:
          type: boolean
          description: The warehouse changed the items or the location after submission (see the order events)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ShopOrderEvent:
      type: object
      properties:
        actor_kind:
          type: string
          enum: [account, user]
        actor_id:
          type: integer
        type:
          type: string
          enum: [submitted, updated, cancelled, confirmed, rejected, items_changed, location_changed]
        payload:
          type: object
        at:
          type: string
          format: date-time

    ShopSummaryRow:
      type: object
      properties:
        key:
          type: string
          description: Product ID, YYYY-MM-DD (delivery day, Europe/Warsaw) or location ID
        label:
          type: string
        product_id:
          type: integer
        product_name:
          type: string
        quantity:
          type: integer
        orders:
          type: integer

    ShopInvite:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        created_by:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type: [string, "null"]
          format: date-time
        used_by_email:
          type: [string, "null"]
        revoked_at:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [active, used, revoked, expired]

    ShopConfig:
      type: object
      description: What organizers may do right now (GET /shop/config)
      properties:
        show_prices:
          type: boolean
        orders_open:
          type: boolean
          description: Whether orders can be submitted and edited right now (deadline already applied)
        orders_open_until:
          type: [string, "null"]
          format: date-time

    ShopSummary:
      type: object
      properties:
        group:
          type: string
          enum: [product, day, location]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ShopSummaryRow"

    ShopInviteCreated:
      type: object
      required: [invite, token]
      properties:
        invite:
          $ref: "#/components/schemas/ShopInvite"
        token:
          type: string
          description: Plaintext invite token, returned only here
        url:
          type: string
          description: Present when SHOP_URL is configured
          example: "https://shop.pyrhouse.space/invite/abc…"

    ShopOrderDetail:
      allOf:
        - $ref: "#/components/schemas/ShopOrder"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/ShopOrderEvent"

    ShopSettings:
      type: object
      required: [show_prices, orders_open, orders_open_until, domain_auto_join, auto_domains]
      properties:
        show_prices:
          type: boolean
          description: false = the organizer API returns no prices at all
        orders_open:
          type: boolean
        orders_open_until:
          type: [string, "null"]
          format: date-time
        domain_auto_join:
          type: boolean
        auto_domains:
          type: array
          items:
            type: string
          example: ["pyrkon.pl"]

    AppSetting:
      type: object
      properties:
        key:
          type: string
          example: "scheduling.sheet_id"
        value:
          type: string
          example: "16BytrbWmyWeBGnlSIDZn1Lnb5rdspoQu_rpc5m5Vtbc"
        description:
          type: string
          example: "Schedule - Google Sheets document ID"
        updated_at:
          type: [string, "null"]
          format: date-time
    AppSettingSummary:
      type: object
      description: Settings list row — value is null unless the list was requested with ?prefix=
      properties:
        key:
          type: string
          example: "scheduling.sheet_id"
        value:
          type: [string, "null"]
        description:
          type: string
          example: "Schedule - Google Sheets document ID"
        updated_at:
          type: [string, "null"]
          format: date-time
    Origin:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
          description: URL-friendly identifier
          example: "druga-era"
        label:
          type: string
          description: Human-readable name
          example: "Druga Era"
        allow_suffix:
          type: boolean
          description: "If true, accepts slug-{suffix} format"
        active:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          example: Could not delete location
        details:
          type: string
          description: Additional technical details (optional)

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Serialized assets are not present in location
        property:
          type: string
          example: assets

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        resource_id:
          type: integer
          example: 42
        resource_type:
          type: string
          example: asset
        action:
          type: string
          example: create
          description: Action performed (e.g. create, update, delete, in_transfer, delivered)
        data:
          type: object
          additionalProperties: true
          description: Action-specific payload (msg, from_location_id, to_location_id, quantity, etc.)
          example:
            msg: "Stock item created successfully"
            quantity: 10
        created_at:
          type: string
          format: date-time
          example: "2026-02-19T12:00:00Z"

    AssetWithLogs:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            assetLogs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLog"

    StockWithLogs:
      allOf:
        - $ref: "#/components/schemas/Stock"
        - type: object
          properties:
            logs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLog"

    Item:
      type: object
      properties:
        id:
          type: integer
          example: 321
        serial:
          type: [string, "null"]
          example: XYZ321
        pyrcode:
          type: string
          example: PYR-LT100
          description: Auto-generated barcode identifier
        status:
          type: string
          example: available
        origin:
          type: string
          example: pyrkon
        location:
          $ref: "#/components/schemas/Location"
          description: Zero-valued in location listings (GET /locations/{id}/assets), where the location is implied
        category:
          $ref: "#/components/schemas/ItemCategory"

    StockItem:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
          example: 4
        quantity:
          type: integer
          example: 99

    Stock:
      type: object
      properties:
        id:
          type: integer
        category:
          $ref: "#/components/schemas/ItemCategory"
        location:
          $ref: "#/components/schemas/Location"
          description: Zero-valued in location listings (GET /locations/{id}/assets), where the location is implied
        quantity:
          type: integer
        origin:
          type: string
        status:
          type: string

    CreatedAssets:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        errors:
          type: array
          items:
            type: string
          description: Per-asset failures, when some were not created

    LocationEquipment:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        stock_items:
          type: array
          items:
            $ref: "#/components/schemas/Stock"

    ItemCategory:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: asset
          description: Category type (asset or stock)
        name:
          type: string
          example: laptop
          description: Normalized name (auto-generated from label)
        label:
          type: string
          example: Laptop
          description: Human-readable display label
        pyr_id:
          type: string
          example: LAP
          description: PYR code prefix for this category

    Location:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Gzdaczroom
        pavilion:
          type: [string, "null"]
          example: "5"
        details:
          type: [string, "null"]

    ServiceDeskStatus:
      type: string
      enum: [new, in_progress, waiting, resolved, closed]

    ServiceDeskPriority:
      type: string
      enum: [low, medium, high]

    ServiceDeskType:
      type: string
      enum: [hardware_issue, replacement, technical_problem, other]

    ServiceDeskUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        fullname:
          type: [string, "null"]

    ServiceDeskRequest:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/ServiceDeskType"
        status:
          $ref: "#/components/schemas/ServiceDeskStatus"
        priority:
          $ref: "#/components/schemas/ServiceDeskPriority"
        created_by:
          type: string
          description: Reporter name as typed in the form
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        location:
          type: [string, "null"]
          description: Name of the linked location, or the free-text location
        location_id:
          type: [integer, "null"]
        created_by_user:
          description: Account that submitted it, null for anonymous reports
          oneOf:
            - $ref: "#/components/schemas/ServiceDeskUser"
            - type: "null"
        assigned_to_user:
          oneOf:
            - $ref: "#/components/schemas/ServiceDeskUser"
            - type: "null"

    CreateServiceDeskRequest:
      type: object
      required: [title, type]
      description: Give at most one of `location` / `location_id`.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        type:
          $ref: "#/components/schemas/ServiceDeskType"
        priority:
          $ref: "#/components/schemas/ServiceDeskPriority"
        created_by:
          type: string
          maxLength: 128
          description: Reporter name
        location:
          type: string
          maxLength: 128
        location_id:
          type: integer

    ServiceDeskComment:
      type: object
      properties:
        id:
          type: integer
        request_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/ServiceDeskUser"

    ServiceDeskRequestType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string

    # ── Scheduling (duty roster) ──────────────────────────────────────────

    ScheduleError:
      type: object
      required: [error, message]
      description: Error body of /schedule endpoints (`error` is a machine slug, `message` is for the user)
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
        details: {}

    SlotType:
      type: string
      enum: [montage, festival, demontage]

    Schedule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        event_start:
          type: string
          format: date-time
          description: Whole event including montage
        event_end:
          type: string
          format: date-time
          description: Whole event including demontage
        festival_start:
          type: string
          format: date-time
        festival_end:
          type: string
          format: date-time
        status:
          type: string
          example: active
        version:
          type: integer
          description: Bumped on every save; send back in PUT /schedule/draft for the conflict check
        created_at:
          type: string
          format: date-time

    ScheduleSlot:
      type: object
      properties:
        id:
          type: integer
        schedule_id:
          type: integer
        type:
          $ref: "#/components/schemas/SlotType"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        credit_hours:
          type: number
          description: Hours credited to each volunteer (not necessarily the slot length)
        capacity:
          type: integer
        label:
          type: [string, "null"]

    SlotVolunteer:
      type: object
      description: A volunteer assigned to a slot; `id` is the assignment ID
      properties:
        id:
          type: integer
        volunteer_id:
          type: integer
        nickname:
          type: string

    SlotWithVolunteers:
      allOf:
        - $ref: "#/components/schemas/ScheduleSlot"
        - type: object
          required: [volunteers]
          properties:
            volunteers:
              type: array
              items:
                $ref: "#/components/schemas/SlotVolunteer"

    ScheduleVolunteer:
      type: object
      properties:
        id:
          type: integer
        schedule_id:
          type: integer
        user_id:
          type: [integer, "null"]
          description: Linked warehouse account; null = volunteer without an account
        nickname:
          type: string
        city:
          type: [string, "null"]
        target_hours:
          type: integer
        available_from:
          type: string
          format: date-time
        available_to:
          type: string
          format: date-time
        notes:
          type: [string, "null"]
        assigned_hours:
          type: number
        discord_confirmed:
          type: [string, "null"]

    VolunteerWithSlots:
      allOf:
        - $ref: "#/components/schemas/ScheduleVolunteer"
        - type: object
          required: [slots]
          properties:
            slots:
              type: array
              description: IDs of the slots the volunteer is assigned to
              items:
                type: integer

    ValidationIssue:
      type: object
      required: [type, severity, message]
      description: Only the fields relevant to the issue type are present.
      properties:
        type:
          type: string
          enum:
            - under_hours
            - over_hours
            - no_festival_shifts
            - slot_understaffed
            - insufficient_break
            - double_booked
            - outside_availability
        severity:
          type: string
          enum: [error, warning]
        volunteer:
          type: string
          description: Volunteer nickname
        volunteer_id:
          type: integer
        slot:
          type: string
          description: Slot description
        slot_id:
          type: integer
        assigned:
          type: integer
        target:
          type: integer
        capacity:
          type: integer
        message:
          type: string

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          description: false when any issue has severity error
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    DayWindow:
      type: object
      properties:
        id:
          type: integer
        schedule_id:
          type: integer
        date:
          type: string
          example: "2026-06-16"
        window_start:
          type: string
          example: "10:00"
        window_end:
          type: string
          example: "18:00"

    UpsertDayWindowRequest:
      type: object
      required: [date, window_start, window_end]
      properties:
        date:
          type: string
          example: "2026-06-16"
        window_start:
          type: string
          example: "10:00"
        window_end:
          type: string
          example: "18:00"

    ScheduleDetail:
      allOf:
        - $ref: "#/components/schemas/Schedule"
        - type: object
          required: [slots, volunteers, validation, day_windows]
          properties:
            slots:
              type: array
              items:
                $ref: "#/components/schemas/SlotWithVolunteers"
            volunteers:
              type: array
              items:
                $ref: "#/components/schemas/VolunteerWithSlots"
            validation:
              $ref: "#/components/schemas/ValidationResult"
            day_windows:
              type: array
              items:
                $ref: "#/components/schemas/DayWindow"

    CreateScheduleRequest:
      type: object
      required: [name, event_start, event_end, festival_start, festival_end]
      properties:
        name:
          type: string
        event_start:
          type: string
          example: "2026-06-14"
        event_end:
          type: string
          example: "2026-06-23"
        festival_start:
          type: string
          example: "2026-06-18 10:00"
        festival_end:
          type: string
          example: "2026-06-21 18:00"

    VolunteerInput:
      type: object
      required: [nickname, hours, available_from, available_to]
      properties:
        nickname:
          type: string
        city:
          type: [string, "null"]
        hours:
          type: integer
          description: Target hours (14 standard, 18 extended)
        available_from:
          type: string
          example: "2026-06-16 08:00"
        available_to:
          type: string
          example: "2026-06-22 20:00"
        notes:
          type: [string, "null"]
        user_id:
          type: [integer, "null"]

    ImportVolunteersRequest:
      type: object
      required: [volunteers]
      properties:
        volunteers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VolunteerInput"

    ImportFromSheetRequest:
      type: object
      required: [sheet_id, sheet_name]
      properties:
        sheet_id:
          type: string
        sheet_name:
          type: string

    ImportResult:
      type: object
      properties:
        imported:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer

    ImportSheetResult:
      allOf:
        - $ref: "#/components/schemas/ImportResult"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              description: Rows that could not be parsed
              items:
                type: string

    UpdateVolunteerRequest:
      type: object
      required: []
      properties:
        nickname:
          type: string
        city:
          type: string
        hours:
          type: integer
          description: Target hours
        available_from:
          type: string
          example: "2026-06-16 08:00"
        available_to:
          type: string
          example: "2026-06-16 20:00"
        notes:
          type: string
        user_id:
          type: [integer, "null"]
          description: Linked account; explicit null unlinks, omitted keeps the link

    MySchedule:
      type: object
      properties:
        volunteer:
          $ref: "#/components/schemas/ScheduleVolunteer"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/MyScheduleSlot"

    MyScheduleSlot:
      type: object
      properties:
        assignment_id:
          type: integer
        slot_id:
          type: integer
        slot_type:
          $ref: "#/components/schemas/SlotType"
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        credit_hours:
          type: number
        label:
          type: [string, "null"]

    AddAssignmentRequest:
      type: object
      required: [volunteer_id, slot_id]
      properties:
        volunteer_id:
          type: integer
        slot_id:
          type: integer

    AssignmentDetail:
      type: object
      properties:
        id:
          type: integer
        slot_id:
          type: integer
        volunteer_id:
          type: integer
        nickname:
          type: string

    MoveAssignmentRequest:
      type: object
      required: [assignment_id, to_slot_id]
      properties:
        assignment_id:
          type: integer
        to_slot_id:
          type: integer

    MoveResponse:
      type: object
      properties:
